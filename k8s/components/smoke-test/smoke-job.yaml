apiVersion: batch/v1
kind: Job
metadata:
  name: garrison-smoke-test
  labels:
    app.kubernetes.io/name: garrison-smoke-test
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-smoke-test
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: smoke
          image: curlimages/curl:8.10.1
          command: ["sh", "/smoke/smoke.sh"]
          env:
            - name: GARRISON_API_URL
              value: http://garrison-server:8700
            - name: GARRISON_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: garrison-secrets
                  key: admin-api-key
          volumeMounts:
            - name: smoke
              mountPath: /smoke
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: smoke
          configMap:
            name: garrison-smoke-test
