# Garrison Helm values. Files under files/ mirror k8s/base and k8s/components; keep them in sync
# (the k8s CI workflow diffs them).

namespaceOverride: ""

image:
  registry: jchristn77
  # Defaults to "v" + Chart appVersion. Never use latest for deployments.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

secrets:
  # Created by k8s/scripts/generate-secrets.sh, or by your secret manager.
  main: garrison-secrets
  nodeCredential: garrison-node-credential
  harnessCredentials: garrison-harness-credentials

database:
  # embedded: deploy an in-cluster Postgres StatefulSet. external: use the Secret named by external.secretName
  # with keys host, port, database, username, password.
  mode: embedded
  embedded:
    image: postgres:17
    # PostgreSQL max_connections. The chart refuses to render when the most server replicas (server.hpa.maxReplicas
    # with the HPA on, otherwise server.replicas) x (pool + 2) + 13 exceeds it (docs/SCALING.md).
    maxConnections: 200
    storage: 5Gi
    storageClassName: ""
  external:
    secretName: garrison-db

server:
  replicas: 1
  expectedReplicas: 1
  # Database.MaxPoolSize per replica (GARRISON_DB_MAX_POOL_SIZE). Empty keeps files/garrison.json (40). Size it so the
  # most replicas x (pool + 2) + 13 fits PostgreSQL's max_connections (docs/SCALING.md, "Database connections").
  dbMaxPoolSize: null
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "2", memory: 1Gi }
  service:
    type: ClusterIP
    nodePorts: { http: null, mcp: null }
  # Internal URLs harnesses on workers use to reach Garrison (delegation). Empty derives the in-cluster service DNS
  # name. Never shown in A2A agent cards.
  publicBaseUrl: ""
  mcpPublicUrl: ""
  # External URL advertised in A2A agent cards and server info, for example https://garrison.example.com. Empty uses
  # the Host header of each request (GARRISON_EXTERNAL_BASE_URL is not set).
  externalBaseUrl: ""
  extraEnv: []
  # Rolling update: surge one new pod before an old one leaves, so an upgrade never drops below the replica count.
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  terminationGracePeriodSeconds: 30
  nodeSelector: {}
  tolerations: []
  # Placement. The defaults are soft so a single-node dev cluster schedules every replica; on a cluster with at
  # least as many nodes as replicas, set podAntiAffinity: hard and whenUnsatisfiable: DoNotSchedule.
  # podAntiAffinity: soft (prefer one replica per host), hard (require it), or none. Ignored when affinity is set.
  podAntiAffinity: soft
  affinity: {}
  # labelSelector defaults to the server pods when omitted.
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilization: 70
    # Optional metrics served by Prometheus Adapter (install it with
    # k8s/components/hpa-custom-metrics/prometheus-adapter-values.yaml first). The HPA takes the largest replica
    # count any metric asks for. Without the adapter, leave these off: a missing metric stops scale-down.
    customMetrics:
      # Average REST requests per second per server pod.
      requestsPerSecond:
        enabled: false
        metricName: garrison_http_requests_per_second
        averageValue: "50"
      # Runs executing on all workers in the namespace, per server replica.
      runsActive:
        enabled: false
        metricName: garrison_runs_active
        averageValue: "100"
    # Any other autoscaling/v2 metric entries, appended as is.
    extraMetrics: []
    # Scale up quickly, down slowly: each replica holds worker long polls and event streams.
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 30
        policies: [{ type: Pods, value: 2, periodSeconds: 60 }]
      scaleDown:
        stabilizationWindowSeconds: 300
        policies: [{ type: Pods, value: 1, periodSeconds: 120 }]
  # Off by default: with one replica a budget would block node drains. Set maxUnavailable (default 1) or
  # minAvailable; maxUnavailable lets a drain progress whenever at least two replicas run.
  pdb:
    enabled: false
    maxUnavailable: 1
    minAvailable: null

# Each pool becomes its own StatefulSet named garrison-worker-<name> (the pool named "default" keeps the name
# garrison-worker so it matches the Kustomize base), with its own headless Service and disruption budget.
#
# Per pool:
#   name                 Pool name: the pod label garrison.io/pool, GARRISON_WORKER_NODE_POOL (Garrison creates the
#                        node pool on first registration), and the first worker label garrison.io/pool=<name>.
#   labels               Extra worker labels, a map or "k=v,k=v" string, appended to garrison.io/pool=<name>
#                        (a later key wins). Deployments select workers with nodeSelector on these labels.
#   harnesses            Optional list of claude, codex, mux, gemini, opencode, pi, fake, provider-api: probe only these, so the pool advertises
#                        only these harness types. Empty probes everything the image has.
#   probes               Optional full probe entries ({ harnessType, executable, arguments, label }) for custom CLIs,
#                        added after harnesses. Either one gives the pool its own settings ConfigMap.
#   image                Optional image name under image.registry with image.tag (for example garrison-worker-mux),
#                        or a full reference containing "/" used as is. Default garrison-worker.
#   nodeSelector, tolerations, affinity
#                        Kubernetes placement for the pool's pods, for example a dedicated node pool.
#   topologySpreadConstraints
#                        Default workerDefaults.topologySpreadConstraints. labelSelector defaults to this pool's pods.
#   pdb                  Overrides workerPdb for this pool ({ enabled, maxUnavailable }).
#   extraEnv, podLabels  Extra container environment and pod labels.
workerPools:
  - name: default
    replicas: 2
    maxConcurrentRuns: 4
    labels: ""
    harnesses: []
    storage: 10Gi
    storageClassName: ""
    terminationGracePeriodSeconds: 900
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { cpu: "4", memory: 4Gi }
    nodeSelector: {}
    tolerations: []
    affinity: {}

workerDefaults:
  # Soft: spread each pool across hosts when there are several, schedule anyway on one node.
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }

# Default disruption budget for every pool (one budget per pool). Pools can override it with their own pdb.
workerPdb:
  enabled: false
  maxUnavailable: 1

dashboard:
  enabled: true
  replicas: 1
  apiUrl: ""
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 500m, memory: 128Mi }

bootstrap:
  enabled: true
  tenantId: default
  image: curlimages/curl:8.10.1

ingress:
  enabled: false
  className: ""
  host: garrison.local
  annotations: {}
  tls: []

networkPolicies:
  enabled: true

# KubernetesJob executor (pod-per-run, plan D-033): workers may run a deployment's runs in a Job per run. Deployments
# opt in with executor: KubernetesJob (or a node pool's defaultExecutor); others keep running as worker subprocesses.
# docs/KUBERNETES.md, "Pod-per-run executor", and docs/SECURITY.md, "Harness isolation", explain the options.
kubernetesExecutor:
  enabled: true
  # Shared idle stock per worker pool/image/configuration. A workerPools[].warmPods map overrides these bounds.
  warmPods:
    enabled: true
    minCount: 1
    maxCount: 4
    idleTimeoutSeconds: 900
    reconcileIntervalSeconds: 2
    maxSpecBytes: 16777216
  # Namespace for run Jobs, Secrets, and pods; empty uses the release namespace. A separate namespace must exist; the
  # chart puts the worker Role, the garrison-run ServiceAccount, and the run NetworkPolicy there. Set runImage too.
  runNamespace: ""
  # Run pod image; empty uses the worker container's image (read from the worker's own pod).
  runImage: ""
  # Image pull secrets (names in the run namespace) for private registries; empty uses the worker pod's.
  imagePullSecrets: []
  # Sandboxed runtime for run pods, for example gvisor or kata (the RuntimeClass must exist).
  runtimeClassName: ""
  # Seconds a finished run Job (and its spec Secret) is kept.
  jobTtlSeconds: 300
  # Seconds a run pod may stay Pending before the run fails with outcome PodFailed.
  pendingTimeoutSeconds: 300
  # Node selector for run pods.
  nodeSelector: {}
  # Address the run NetworkPolicy blocks; run pods start the harness only once it is unreachable, so the harness
  # never runs before the policy is programmed. Empty disables the check (needed when networkPolicies.enabled is
  # false or the network plugin does not enforce policies).
  egressCanary: '{{ include "garrison.serverHost" . }}:8700'
  # Per-deployment egress allowlists (P11.15): workers create a NetworkPolicy per run of a deployment with
  # egressRules that allows only DNS, the MCP port, and those rules. Takes effect only with networkPolicies.enabled
  # and an egressCanary, which prove the network plugin enforces policies; otherwise such runs stay queued.
  egressAllowlists: true
  # Default egress of run pods besides DNS and the Garrison MCP port: CIDRs with optional except lists and ports. It
  # does not apply to run pods of deployments with egressRules (garrison-run-default-egress skips them).
  runEgress:
    # Never link-local: 169.254.0.0/16 holds the cloud instance metadata service (SR-23).
    - cidr: 0.0.0.0/0
      except: [169.254.0.0/16]
      ports: [443]

smokeTest:
  enabled: false
  image: curlimages/curl:8.10.1

# Observability stack (same as k8s/components/observability): Prometheus, Loki, Tempo, Grafana with the six
# Garrison dashboards, and Grafana Alloy (OTLP receiver and pod log shipper). Grafana admin credentials come from
# the Secret named by grafana.adminSecret (keys admin-user, admin-password; k8s/scripts/generate-secrets.sh
# creates garrison-grafana). The files under files/observability mirror k8s/components/observability.
observability:
  enabled: false
  otlp:
    # Server and workers export traces to garrison-alloy:4317 (GARRISON_OTLP_ENABLE, GARRISON_WORKER_OTLP_ENABLE).
    enabled: true
  # Browser-facing URLs the server hands to the Garrison dashboard (server-info). The defaults match
  # k8s/scripts/port-forward.sh. Set them to your ingress hosts when you expose the services another way.
  urls:
    grafana: http://127.0.0.1:3000
    prometheus: http://127.0.0.1:9090
    loki: http://127.0.0.1:3100
    tempo: http://127.0.0.1:3200
  grafana:
    image: grafana/grafana-oss:13.0.2
    adminSecret: garrison-grafana
    # GF_SERVER_ROOT_URL. Empty uses urls.grafana.
    rootUrl: ""
    service:
      type: ClusterIP
      nodePort: null
    ingress:
      enabled: false
      className: ""
      host: grafana.garrison.local
      annotations: {}
      tls: []
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: "2", memory: 768Mi }
  prometheus:
    image: prom/prometheus:v3.5.4
    retention: 3d
    retentionSize: 1GB
    storage: 2Gi
    storageClassName: ""
    service:
      type: ClusterIP
      nodePort: null
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  loki:
    image: grafana/loki:3.5.5
    storage: 2Gi
    storageClassName: ""
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  tempo:
    image: grafana/tempo:2.6.1
    storage: 2Gi
    storageClassName: ""
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 512Mi }
  alloy:
    image: grafana/alloy:v1.5.0
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 500m, memory: 384Mi }
