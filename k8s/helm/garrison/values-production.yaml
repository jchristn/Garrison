# helm install garrison k8s/helm/garrison -n garrison -f k8s/helm/garrison/values-production.yaml --set image.tag=v0.1.0-alpha
database:
  mode: external
  external:
    secretName: garrison-db
server:
  replicas: 3
  expectedReplicas: 3
  # What A2A agent cards advertise. Match ingress.host.
  externalBaseUrl: https://garrison.example.com
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "4", memory: 2Gi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCpuUtilization: 70
  pdb:
    enabled: true
    maxUnavailable: 1
  # Soft spread across zones and hosts plus soft anti-affinity, as in overlays/production. Switch to hard
  # (podAntiAffinity: hard, whenUnsatisfiable: DoNotSchedule) once you have as many nodes and zones as replicas.
  podAntiAffinity: soft
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway }
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }
  # To also scale on request rate and active runs, install Prometheus Adapter
  # (k8s/components/hpa-custom-metrics/prometheus-adapter-values.yaml) and enable
  # server.hpa.customMetrics.requestsPerSecond and server.hpa.customMetrics.runsActive.
workerDefaults:
  topologySpreadConstraints:
    - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway }
    - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway }
workerPdb:
  enabled: true
  maxUnavailable: 1
workerPools:
  - name: default
    replicas: 4
    maxConcurrentRuns: 4
    labels: ""
    harnesses: []
    storage: 50Gi
    storageClassName: ""
    terminationGracePeriodSeconds: 900
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "8", memory: 8Gi }
    nodeSelector: {}
    tolerations: []
    # Prefer hosts without a control-plane replica, so a busy harness never starves the API.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels: { app.kubernetes.io/name: garrison-server }
ingress:
  enabled: true
  className: nginx
  host: garrison.example.com
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  tls:
    - hosts: [garrison.example.com]
      secretName: garrison-tls
# Observability: most production clusters already run Prometheus, Grafana, Loki, and Tempo. Leave this off and point
# your stack at the prometheus.io annotations, or enable it and set urls to your ingress hosts.
observability:
  enabled: false
  urls:
    grafana: https://grafana.garrison.example.com
    prometheus: ""
    loki: ""
    tempo: ""
  grafana:
    ingress:
      enabled: false
      className: nginx
      host: grafana.garrison.example.com
