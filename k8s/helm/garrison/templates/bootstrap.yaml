{{- if .Values.bootstrap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: garrison-manifests
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
data:
  agents.yaml: |
{{ .Files.Get "files/agents.yaml" | indent 4 }}
  deployment-claude.yaml: |
{{ .Files.Get "files/deployment-claude.yaml" | indent 4 }}
  deployment-codex.yaml: |
{{ .Files.Get "files/deployment-codex.yaml" | indent 4 }}
  deployment-mux.yaml: |
{{ .Files.Get "files/deployment-mux.yaml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garrison-bootstrap-scripts
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
data:
  bootstrap.sh: |
{{ .Files.Get "files/bootstrap.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: garrison-bootstrap
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: bootstrap
          image: {{ .Values.bootstrap.image }}
          command: ["sh", "/scripts/bootstrap.sh"]
          env:
            - { name: GARRISON_API_URL, value: "http://garrison-server:8700" }
            - { name: GARRISON_TENANT_ID, value: {{ .Values.bootstrap.tenantId | quote }} }
            - { name: GARRISON_MANIFEST_DIR, value: /manifests }
            - name: GARRISON_ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.main }}, key: admin-api-key } }
          envFrom:
            - secretRef: { name: {{ .Values.secrets.harnessCredentials }}, optional: true }
          volumeMounts:
            - { name: scripts, mountPath: /scripts, readOnly: true }
            - { name: manifests, mountPath: /manifests, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: garrison-bootstrap-scripts }
        - name: manifests
          configMap: { name: garrison-manifests }
{{- end }}
