{{- /*
Worker pools. Each entry in workerPools becomes its own StatefulSet, headless Service, optional settings ConfigMap,
and optional PodDisruptionBudget. The pool named "default" keeps the name garrison-worker so it matches the
Kustomize base. Every pool's pods carry app.kubernetes.io/name=garrison-worker (network policies, Prometheus,
Grafana) and garrison.io/pool=<name> (selectors, per-pool budgets, the Prometheus pool label).

What the worker reports to Garrison:
  node pool  GARRISON_WORKER_NODE_POOL = <name>; the control plane creates the node pool on first registration
  labels     GARRISON_WORKER_LABELS = garrison.io/pool=<name>, then the pool's labels (a later key wins)
  harnesses  whatever the probes find; harnesses or probes limit them per pool (otherwise the image's defaults)
*/ -}}
{{- $harnessProbes := dict "claude" (dict "HarnessType" "ClaudeCode" "Executable" "claude" "Label" "claude") "codex" (dict "HarnessType" "Codex" "Executable" "codex" "Label" "codex") "mux" (dict "HarnessType" "Mux" "Executable" "mux" "Label" "mux") "gemini" (dict "HarnessType" "GeminiCli" "Executable" "gemini" "Label" "gemini") "opencode" (dict "HarnessType" "OpenCode" "Executable" "opencode" "Label" "opencode") "pi" (dict "HarnessType" "Pi" "Executable" "pi" "Label" "pi") "fake" (dict "HarnessType" "Generic" "Executable" "garrison-fake-harness" "Label" "fake") "provider-api" (dict "HarnessType" "ProviderApi" "Executable" "garrison-provider-api" "Label" "provider-api") }}
{{- range $pool := .Values.workerPools }}
{{- $name := ternary "garrison-worker" (printf "garrison-worker-%s" $pool.name) (eq $pool.name "default") }}
{{- $labels := printf "garrison.io/pool=%s" $pool.name }}
{{- if kindIs "map" $pool.labels }}
{{- range $k, $v := $pool.labels }}
{{- $labels = printf "%s,%s=%s" $labels $k (toString $v) }}
{{- end }}
{{- else if $pool.labels }}
{{- $labels = printf "%s,%s" $labels $pool.labels }}
{{- end }}
{{- $probes := list }}
{{- range $h := ($pool.harnesses | default list) }}
{{- if not (hasKey $harnessProbes $h) }}
{{- fail (printf "workerPools[%s].harnesses: unknown harness %q (use claude, codex, mux, gemini, opencode, pi, fake, provider-api, or probes)" $pool.name $h) }}
{{- end }}
{{- $probes = append $probes (merge (dict "Arguments" (list "--version")) (get $harnessProbes $h)) }}
{{- end }}
{{- range $p := ($pool.probes | default list) }}
{{- $probes = append $probes $p }}
{{- end }}
{{- $settingsName := "garrison-worker-settings" }}
{{- $settingsJson := $.Files.Get "files/garrison-worker.json" }}
{{- if $probes }}
{{- $settingsName = printf "garrison-worker-%s-settings" $pool.name }}
{{- $settings := fromJson $settingsJson }}
{{- $_ := set $settings "Probes" $probes }}
{{- $_ := set $settings "Labels" (dict "garrison.io/pool" $pool.name) }}
{{- $settingsJson = toPrettyJson $settings }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $settingsName }}
  namespace: {{ include "garrison.namespace" $ }}
  labels:
    {{- include "garrison.labels" $ | nindent 4 }}
    garrison.io/pool: {{ $pool.name }}
data:
  garrison-worker.json: |
{{ $settingsJson | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ include "garrison.namespace" $ }}
  labels:
    {{- include "garrison.labels" $ | nindent 4 }}
    app.kubernetes.io/name: garrison-worker
    app.kubernetes.io/component: worker
    garrison.io/pool: {{ $pool.name }}
spec:
  serviceName: {{ $name }}
  replicas: {{ $pool.replicas }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-worker
      garrison.io/pool: {{ $pool.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-worker
        app.kubernetes.io/component: worker
        garrison.io/pool: {{ $pool.name }}
        {{- with $pool.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9465"
        prometheus.io/path: /metrics
        checksum/settings: {{ $settingsJson | sha256sum }}
    spec:
      serviceAccountName: garrison-worker
      # The token lets the worker create run Jobs (rbac.yaml); run pods never get one.
      automountServiceAccountToken: {{ $.Values.kubernetesExecutor.enabled }}
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: {{ $pool.terminationGracePeriodSeconds | default 900 }}
      {{- with $pool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pool.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := $pool.topologySpreadConstraints | default $.Values.workerDefaults.topologySpreadConstraints }}
      {{- with $spread }}
      {{- $constraints := list }}
      {{- range $c := . }}
      {{- $constraints = append $constraints (merge (deepCopy $c) (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "garrison-worker" "garrison.io/pool" $pool.name)))) }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-server
          image: {{ $.Values.bootstrap.image }}
          command: ["sh", "-c", "until curl -fsS -o /dev/null http://garrison-server:8700/v1.0/api/health; do sleep 2; done"]
      containers:
        - name: worker
          {{- if and $pool.image (contains "/" $pool.image) }}
          image: {{ $pool.image }}
          {{- else }}
          image: {{ include "garrison.image" (dict "root" $ "name" ($pool.image | default "garrison-worker")) }}
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - { name: health, containerPort: 8710 }
            - { name: metrics, containerPort: 9465 }
          env:
            - { name: GARRISON_WORKER_SETTINGS_FILE, value: /etc/garrison/garrison-worker.json }
            - { name: GARRISON_WORKER_SERVER_URL, value: "http://garrison-server:8700" }
            - { name: GARRISON_WORKER_CONTAINERIZED, value: "true" }
            - name: GARRISON_WORKER_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # The metrics listener (9465) binds the pod IP that Prometheus scrapes; /metrics is not served on 8710.
            - name: GARRISON_WORKER_PROMETHEUS_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: GARRISON_WORKER_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.nodeCredential }}, key: access-key } }
            - name: GARRISON_WORKER_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.nodeCredential }}, key: secret-key } }
            - { name: GARRISON_WORKER_MAX_CONCURRENT_RUNS, value: {{ $pool.maxConcurrentRuns | quote }} }
            - { name: GARRISON_WORKER_WORK_ROOT, value: /workspaces }
            - { name: GARRISON_WORKER_HEALTH_PORT, value: "8710" }
            - { name: GARRISON_WORKER_LABELS, value: {{ $labels | quote }} }
            - { name: GARRISON_WORKER_NODE_POOL, value: {{ $pool.name | quote }} }
            {{- with $.Values.kubernetesExecutor }}
            {{- if .enabled }}
            - { name: GARRISON_WORKER_KUBERNETES_ENABLED, value: "true" }
            {{- $warm := mergeOverwrite (deepCopy .warmPods) (default dict $pool.warmPods) }}
            - { name: GARRISON_WORKER_WARM_PODS_ENABLED, value: {{ $warm.enabled | quote }} }
            - { name: GARRISON_WORKER_WARM_PODS_MIN, value: {{ $warm.minCount | int | quote }} }
            - { name: GARRISON_WORKER_WARM_PODS_MAX, value: {{ $warm.maxCount | int | quote }} }
            - { name: GARRISON_WORKER_WARM_PODS_IDLE_SECONDS, value: {{ $warm.idleTimeoutSeconds | int | quote }} }
            - { name: GARRISON_WORKER_WARM_PODS_INTERVAL_SECONDS, value: {{ $warm.reconcileIntervalSeconds | int | quote }} }
            - { name: GARRISON_WORKER_WARM_PODS_MAX_SPEC_BYTES, value: {{ $warm.maxSpecBytes | int | quote }} }
            - { name: GARRISON_WORKER_JOB_TTL_SECONDS, value: {{ .jobTtlSeconds | quote }} }
            - { name: GARRISON_WORKER_RUN_PENDING_TIMEOUT_SECONDS, value: {{ .pendingTimeoutSeconds | quote }} }
            {{- if and .egressCanary $.Values.networkPolicies.enabled }}
            - { name: GARRISON_WORKER_RUN_EGRESS_CANARY, value: {{ tpl .egressCanary $ | quote }} }
            - { name: GARRISON_WORKER_RUN_EGRESS_ALLOWLISTS, value: {{ .egressAllowlists | quote }} }
            {{- end }}
            {{- if .runNamespace }}
            - { name: GARRISON_WORKER_RUN_NAMESPACE, value: {{ .runNamespace | quote }} }
            {{- end }}
            {{- if .runImage }}
            - { name: GARRISON_WORKER_RUN_IMAGE, value: {{ .runImage | quote }} }
            {{- end }}
            {{- if .imagePullSecrets }}
            - { name: GARRISON_WORKER_RUN_IMAGE_PULL_SECRETS, value: {{ join "," .imagePullSecrets | quote }} }
            {{- end }}
            {{- if .runtimeClassName }}
            - { name: GARRISON_WORKER_RUN_RUNTIME_CLASS, value: {{ .runtimeClassName | quote }} }
            {{- end }}
            {{- if .nodeSelector }}
            {{- $pairs := list }}
            {{- range $k, $v := .nodeSelector }}{{ $pairs = append $pairs (printf "%s=%s" $k $v) }}{{- end }}
            - { name: GARRISON_WORKER_RUN_NODE_SELECTOR, value: {{ join "," $pairs | quote }} }
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $.Values.observability.enabled }}
            - { name: GARRISON_WORKER_OTLP_ENABLE, value: {{ $.Values.observability.otlp.enabled | quote }} }
            - { name: GARRISON_WORKER_OTLP_ENDPOINT, value: "http://garrison-alloy:4317" }
            {{- end }}
            {{- with $pool.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - { name: settings, mountPath: /etc/garrison, readOnly: true }
            - { name: workspaces, mountPath: /workspaces }
          resources:
            {{- toYaml $pool.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8710/health/live" "failure" 24 "success" 1) | nindent 12 }}
          readinessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8710/health/ready" "failure" 2 "success" 2) | nindent 12 }}
          livenessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8710/health/live" "failure" 2 "success" 1) | nindent 12 }}
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: settings
          configMap: { name: {{ $settingsName }} }
  volumeClaimTemplates:
    - metadata:
        name: workspaces
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if $pool.storageClassName }}
        storageClassName: {{ $pool.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pool.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "garrison.namespace" $ }}
  labels:
    {{- include "garrison.labels" $ | nindent 4 }}
    app.kubernetes.io/name: garrison-worker
    garrison.io/pool: {{ $pool.name }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garrison-worker
    garrison.io/pool: {{ $pool.name }}
  ports:
    - { name: health, port: 8710, targetPort: health }
    - { name: metrics, port: 9465, targetPort: metrics }
{{- $pdb := merge (deepCopy ($pool.pdb | default dict)) $.Values.workerPdb }}
{{- if $pdb.enabled }}
---
# One budget per pool: a pod matched by two budgets cannot be evicted at all.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ include "garrison.namespace" $ }}
  labels:
    {{- include "garrison.labels" $ | nindent 4 }}
    garrison.io/pool: {{ $pool.name }}
spec:
  maxUnavailable: {{ $pdb.maxUnavailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-worker
      garrison.io/pool: {{ $pool.name }}
{{- end }}
{{- end }}
