apiVersion: apps/v1
kind: Deployment
metadata:
  name: garrison-server
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-server
    app.kubernetes.io/component: control-plane
spec:
  {{- if not .Values.server.hpa.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  strategy:
    {{- toYaml .Values.server.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-server
        app.kubernetes.io/component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8700"
        prometheus.io/path: /metrics
        checksum/settings: {{ .Files.Get "files/garrison.json" | sha256sum }}
    spec:
      serviceAccountName: garrison-server
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $antiAffinity := include "garrison.serverAntiAffinity" . }}
      {{- if or .Values.server.affinity $antiAffinity }}
      affinity:
        {{- if .Values.server.affinity }}
        {{- toYaml .Values.server.affinity | nindent 8 }}
        {{- else }}
        {{- $antiAffinity | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.server.topologySpreadConstraints }}
      {{- $constraints := list }}
      {{- range $c := . }}
      {{- $constraints = append $constraints (merge (deepCopy $c) (dict "labelSelector" (dict "matchLabels" (dict "app.kubernetes.io/name" "garrison-server")))) }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.server.terminationGracePeriodSeconds }}
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z -w 2 \"$GARRISON_DB_HOST\" \"$GARRISON_DB_PORT\"; do sleep 2; done"]
          env:
            {{- include "garrison.dbEnv" . | nindent 12 }}
      containers:
        - name: server
          image: {{ include "garrison.image" (dict "root" . "name" "garrison-server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8700 }
            - { name: mcp, containerPort: 8701 }
            - { name: metrics, containerPort: 9464 }
          env:
            - { name: GARRISON_SETTINGS_FILE, value: /etc/garrison/garrison.json }
            - { name: GARRISON_SETTINGS_READONLY, value: "true" }
            - name: GARRISON_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: GARRISON_DB_TYPE, value: Postgresql }
            {{- include "garrison.dbEnv" . | nindent 12 }}
            {{- range $pair := list (list "GARRISON_MASTER_KEY" "master-key") (list "GARRISON_AUTH_SIGNING_KEY" "signing-key") (list "GARRISON_ADMIN_API_KEY" "admin-api-key") (list "GARRISON_ADMIN_PASSWORD" "admin-password") (list "GARRISON_DEFAULT_ACCESS_KEY" "default-access-key") (list "GARRISON_DEFAULT_SECRET_KEY" "default-secret-key") }}
            - name: {{ index $pair 0 }}
              valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.main }}, key: {{ index $pair 1 }} } }
            {{- end }}
            - name: GARRISON_NODE_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.nodeCredential }}, key: access-key } }
            - name: GARRISON_NODE_SECRET_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.nodeCredential }}, key: secret-key } }
            - name: GARRISON_MCP_PUBLIC_URL
              value: {{ default (printf "http://%s:8701" (include "garrison.serverHost" .)) .Values.server.mcpPublicUrl | quote }}
            - name: GARRISON_PUBLIC_BASE_URL
              value: {{ default (printf "http://%s:8700" (include "garrison.serverHost" .)) .Values.server.publicBaseUrl | quote }}
            {{- with .Values.server.externalBaseUrl }}
            - name: GARRISON_EXTERNAL_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            - { name: GARRISON_EXPECTED_REPLICAS, value: {{ .Values.server.expectedReplicas | quote }} }
            {{- include "garrison.observabilityServerEnv" . | nindent 12 }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - { name: settings, mountPath: /etc/garrison, readOnly: true }
            - { name: data, mountPath: /app/data }
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          startupProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8700/v1.0/api/health" "failure" 24 "success" 1) | nindent 12 }}
          readinessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8700/v1.0/api/health" "failure" 2 "success" 2) | nindent 12 }}
          livenessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1:8700/v1.0/api/health" "failure" 2 "success" 1) | nindent 12 }}
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
      volumes:
        - name: settings
          configMap: { name: garrison-server-settings }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: garrison-server
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app.kubernetes.io/name: garrison-server
  ports:
    - name: http
      port: 8700
      targetPort: http
      {{- if and (eq .Values.server.service.type "NodePort") .Values.server.service.nodePorts.http }}
      nodePort: {{ .Values.server.service.nodePorts.http }}
      {{- end }}
    - name: mcp
      port: 8701
      targetPort: mcp
      {{- if and (eq .Values.server.service.type "NodePort") .Values.server.service.nodePorts.mcp }}
      nodePort: {{ .Values.server.service.nodePorts.mcp }}
      {{- end }}
    - name: metrics
      port: 9464
      targetPort: metrics
{{- if .Values.server.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: garrison-server
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: garrison-server }
  minReplicas: {{ .Values.server.hpa.minReplicas }}
  maxReplicas: {{ .Values.server.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.server.hpa.targetCpuUtilization }} }
    {{- with .Values.server.hpa.customMetrics.requestsPerSecond }}
    {{- if .enabled }}
    # Served by Prometheus Adapter (k8s/components/hpa-custom-metrics/prometheus-adapter-values.yaml).
    - type: Pods
      pods:
        metric: { name: {{ .metricName }} }
        target: { type: AverageValue, averageValue: {{ .averageValue | quote }} }
    {{- end }}
    {{- end }}
    {{- with .Values.server.hpa.customMetrics.runsActive }}
    {{- if .enabled }}
    # Served by Prometheus Adapter (k8s/components/hpa-custom-metrics/prometheus-adapter-values.yaml).
    - type: External
      external:
        metric: { name: {{ .metricName }} }
        target: { type: AverageValue, averageValue: {{ .averageValue | quote }} }
    {{- end }}
    {{- end }}
    {{- with .Values.server.hpa.extraMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.server.hpa.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.server.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garrison-server
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
spec:
  {{- if .Values.server.pdb.minAvailable }}
  minAvailable: {{ .Values.server.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.server.pdb.maxUnavailable | default 1 }}
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: garrison-server }
{{- end }}
