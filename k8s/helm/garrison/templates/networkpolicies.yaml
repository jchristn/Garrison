{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-worker
  namespace: {{ include "garrison.namespace" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: garrison-worker }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports: [ { port: 8710 }, { port: 9465 } ]
  egress:
    # Any pod in the cluster (DNS, Postgres, the server, run pods), and any address outside it except the cloud
    # instance metadata service: these pods fetch tenant-chosen URLs and must not hand them the node's identity (SR-23).
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-server
  namespace: {{ include "garrison.namespace" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: garrison-server }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports: [ { port: 8700 }, { port: 8701 }, { port: 9464 } ]
  egress:
    # Any pod in the cluster (DNS, Postgres, the server, run pods), and any address outside it except the cloud
    # instance metadata service: these pods fetch tenant-chosen URLs and must not hand them the node's identity (SR-23).
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [169.254.169.254/32]
{{- if eq .Values.database.mode "embedded" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-postgres
  namespace: {{ include "garrison.namespace" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: garrison-postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: garrison-server }
      ports: [ { port: 5432 } ]
{{- end }}
{{- if .Values.kubernetesExecutor.enabled }}
---
# Run pods (KubernetesJob executor): no ingress; egress to DNS and the Garrison MCP port (delegation), for every run pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-run
  namespace: {{ include "garrison.runNamespace" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: garrison-run }
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports: [ { port: 53, protocol: UDP }, { port: 53, protocol: TCP } ]
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: garrison-server }
          {{- if ne (include "garrison.runNamespace" .) (include "garrison.namespace" .) }}
          namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ include "garrison.namespace" . }} }
          {{- end }}
      ports: [ { port: 8701 } ]
---
# Default run egress (runEgress), for run pods whose deployment has no egress allowlist. Allowlisted pods carry
# garrison.io/egress=allowlist and get a per-run NetworkPolicy from the worker instead (P11.15).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-run-default-egress
  namespace: {{ include "garrison.runNamespace" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: garrison-run }
    matchExpressions:
      - { key: garrison.io/egress, operator: DoesNotExist }
  policyTypes: ["Egress"]
  egress:
    {{- range $rule := .Values.kubernetesExecutor.runEgress }}
    - to:
        - ipBlock:
            cidr: {{ $rule.cidr }}
            {{- with $rule.except }}
            except:
              {{- toYaml . | nindent 14 }}
            {{- end }}
      {{- with $rule.ports }}
      ports:
        {{- range $port := . }}
        - port: {{ $port }}
        {{- end }}
      {{- end }}
    {{- end }}
{{- end }}
{{- end }}
