{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garrison
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # /v1.0 covers the app gateway (/v1.0/apps/...) and / covers the app UI (/apps/{slug}/, served by the dashboard).
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - { path: /mcp, pathType: Prefix, backend: { service: { name: garrison-server, port: { name: mcp } } } }
          - { path: /v1.0, pathType: Prefix, backend: { service: { name: garrison-server, port: { name: http } } } }
          - { path: /openapi.json, pathType: Exact, backend: { service: { name: garrison-server, port: { name: http } } } }
          {{- if .Values.dashboard.enabled }}
          - { path: /, pathType: Prefix, backend: { service: { name: garrison-dashboard, port: { name: http } } } }
          {{- end }}
{{- end }}
