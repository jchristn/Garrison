{{- range $name := list "garrison-server" "garrison-worker" "garrison-dashboard" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "garrison.namespace" $ }}
  labels:
    {{- include "garrison.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.kubernetesExecutor.enabled }}
---
# Run pods' account: no RoleBindings, and run pods never mount its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-run
  namespace: {{ include "garrison.runNamespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-run
automountServiceAccountToken: false
{{- end }}
