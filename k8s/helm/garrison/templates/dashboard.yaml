{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garrison-dashboard
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: garrison-dashboard
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: {{ include "garrison.image" (dict "root" . "name" "garrison-dashboard") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 80 }
          env:
            - { name: GARRISON_API_URL, value: {{ .Values.dashboard.apiUrl | quote }} }
            - { name: GARRISON_CSP_CONNECT_SRC, value: {{ .Values.dashboard.cspConnectSrc | quote }} }
            - { name: GARRISON_API_UPSTREAM, value: {{ printf "http://%s:8700" (include "garrison.serverHost" .) | quote }} }
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          readinessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1/health" "failure" 2 "success" 2) | nindent 12 }}
          livenessProbe:
            {{- include "garrison.probe" (dict "url" "http://127.0.0.1/health" "failure" 2 "success" 1) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: garrison-dashboard
  namespace: {{ include "garrison.namespace" . }}
  labels:
    {{- include "garrison.labels" . | nindent 4 }}
    app.kubernetes.io/name: garrison-dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  selector:
    app.kubernetes.io/name: garrison-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.dashboard.service.type "NodePort") .Values.dashboard.service.nodePort }}
      nodePort: {{ .Values.dashboard.service.nodePort }}
      {{- end }}
{{- end }}
