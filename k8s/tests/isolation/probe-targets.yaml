# Two small HTTP servers the isolation probes connect to (P11.17). isolation-target answers on 8080 and 8081; the
# Untrusted deployment's egress allowlist names its pod IP with port 8080 only, so 8080 is the positive control and
# 8081 must stay blocked. isolation-decoy is another pod on 8080 that no allowlist names, so it must stay blocked too.
# No NetworkPolicy selects these pods, so they accept every connection that the caller's own policy lets out.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolation-target
  labels:
    app.kubernetes.io/name: isolation-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isolation-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isolation-target
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: http
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/www && echo isolation-target > /tmp/www/index.html
              httpd -p 8081 -h /tmp/www
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - containerPort: 8080
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isolation-decoy
  labels:
    app.kubernetes.io/name: isolation-decoy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: isolation-decoy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isolation-decoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: http
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /tmp/www && echo isolation-decoy > /tmp/www/index.html
              exec httpd -f -p 8080 -h /tmp/www
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
