apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Isolation red-team install (P11.17, k8s/tests/isolation-test.sh): the scale-test overlay (KubernetesJob executor,
# egress canary, egress allowlists, and warm run pods on, as in the base) plus two in-cluster TCP targets for the probes,
# and no dashboard. Allowlisted runs never use warm pods, so the Untrusted runs take the cold Job path, and the Trusted
# run pod contrast takes a warm pod, as by default. Apply it through isolation-test.sh, which wraps it with deploy.sh
# (OVERLAY_DIR).
namespace: garrison

resources:
  - ../overlay
  - probe-targets.yaml

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: garrison-dashboard
      spec:
        replicas: 0
