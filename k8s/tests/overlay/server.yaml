apiVersion: v1
kind: Service
metadata:
  name: garrison-server
spec:
  type: NodePort
  ports:
    - name: http
      port: 8700
      targetPort: http
      nodePort: 30870
    - name: mcp
      port: 8701
      targetPort: mcp
      nodePort: 30871
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garrison-server
spec:
  template:
    spec:
      containers:
        - name: server
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 768Mi
