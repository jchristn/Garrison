# Example of the Secrets Garrison expects. Never commit real values.
# k8s/scripts/generate-secrets.sh creates these with random values; use this file only as a reference
# or as a starting point for an external secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: garrison-secrets
  namespace: garrison
type: Opaque
stringData:
  master-key: "<base64 of 32 random bytes>"
  signing-key: "<random string>"
  admin-api-key: "<random string>"
  admin-password: "<random string>"
  db-password: "<random string>"
  default-access-key: "access_<32 random characters>"
  default-secret-key: "secret_<48 random characters>"
---
apiVersion: v1
kind: Secret
metadata:
  name: garrison-node-credential
  namespace: garrison
type: Opaque
stringData:
  access-key: "access_<32 random characters>"
  secret-key: "secret_<48 random characters>"
---
# Optional. Every key is optional; the bootstrap Job creates a Garrison secret and the matching sample
# deployment only for keys that are present.
apiVersion: v1
kind: Secret
metadata:
  name: garrison-harness-credentials
  namespace: garrison
type: Opaque
stringData:
  ANTHROPIC_API_KEY: ""
  CLAUDE_CODE_OAUTH_TOKEN: ""
  OPENAI_API_KEY: ""
  # Alternative to OPENAI_API_KEY: the full contents of a Codex auth.json (ChatGPT sign-in).
  CODEX_AUTH_JSON: ""
  MUX_BASE_URL: ""
  MUX_MODEL: ""
  MUX_API_KEY: ""
  MUX_ADAPTER_TYPE: ""
---
# production overlay only: external Postgresql connection.
apiVersion: v1
kind: Secret
metadata:
  name: garrison-db
  namespace: garrison
type: Opaque
stringData:
  host: "<hostname>"
  port: "5432"
  database: "garrison"
  username: "<username>"
  password: "<password>"
