# The worker's permissions for the KubernetesJob executor (pod-per-run, plan D-033), in this namespace only and
# nothing cluster-wide. The worker creates a Job and a spec Secret per run (the Secret is owned by the Job and garbage
# collected with it), reads the run pod's status and log, and deletes the Job on cancel, timeout, or reconciliation.
# Warm stock also needs pod reservation/deletion, authenticated stdin attach, and shared refill Leases.
# It is never granted get, list, or watch on Secrets. Note that anyone who can create Jobs in a namespace can mount
# that namespace's Secrets, so for untrusted prompts run the pods in a separate namespace (Worker RunNamespace,
# docs/KUBERNETES.md).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garrison-worker-runs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garrison-worker-runs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garrison-worker-runs
subjects:
  - kind: ServiceAccount
    name: garrison-worker
