# Workers accept no inbound traffic except health and metrics probes. The server accepts traffic from the dashboard,
# workers, ingress, and the bootstrap Job. Both may reach any pod in the cluster (DNS, Postgres, the server, run pods)
# and any address outside it except the cloud instance metadata service, 169.254.169.254, because they fetch
# tenant-chosen URLs (MCP server tests, S3 endpoints, MCP preflight) and must not hand those requests the node's cloud
# identity (SR-23). Tighten egress in production to the endpoints your harnesses actually call.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garrison-worker
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8710
        - port: 9465
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-server
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garrison-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - port: 8700
        - port: 8701
        - port: 9464
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
---
# Run pods (KubernetesJob executor) accept no inbound traffic. They may resolve DNS and reach the Garrison MCP port on
# the server (agent-to-agent delegation). This policy selects every run pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-run
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garrison-run
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garrison-server
      ports:
        - port: 8701
---
# Default run egress: the internet on 443 only (model APIs, git over HTTPS), never link-local addresses such as the
# cloud instance metadata service (169.254.0.0/16, SR-23), for run pods whose deployment has no
# egress allowlist. Pods of deployments with egressRules carry garrison.io/egress=allowlist, so this policy does not
# select them; the worker gives each of them a NetworkPolicy that allows only DNS, the MCP port, and the deployment's
# rules (P11.15). Widen or narrow this rule to the endpoints your harnesses need; the Helm chart's runEgress value does
# the same. Keep the matchExpressions: a rule here that also selected allowlisted pods would widen their egress, and
# workers then stop reporting egress control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garrison-run-default-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: garrison-run
    matchExpressions:
      - key: garrison.io/egress
        operator: DoesNotExist
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - port: 443
