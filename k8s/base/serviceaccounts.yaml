# Service accounts. Only the worker uses a token: it creates a Job per run for the KubernetesJob executor
# (rbac.yaml grants that in this namespace only). garrison-run is the run pods' account; it has no RoleBindings
# and run pods never mount its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-dashboard
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-run
  labels:
    app.kubernetes.io/name: garrison-run
automountServiceAccountToken: false
