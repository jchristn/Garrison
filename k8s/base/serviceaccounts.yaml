# Service accounts carry no Kubernetes API permissions in the MVP. Phase 11 adds a Role for the
# pod-per-run executor to the worker account.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garrison-dashboard
automountServiceAccountToken: false
