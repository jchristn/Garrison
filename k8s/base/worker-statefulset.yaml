apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garrison-worker
  labels:
    app.kubernetes.io/name: garrison-worker
    app.kubernetes.io/component: worker
spec:
  serviceName: garrison-worker
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garrison-worker
        app.kubernetes.io/component: worker
        # Pod label only (never in the selector, which is immutable). Prometheus copies it to the pool label, and
        # components/worker-pools uses it to tell pools apart. Keep it equal to GARRISON_WORKER_NODE_POOL.
        garrison.io/pool: default
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8710"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: garrison-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      # Workers drain on SIGTERM: they stop leasing and wait for running harnesses before exiting.
      terminationGracePeriodSeconds: 900
      # Soft preference: spread workers across hosts when there are several, schedule anyway on one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: garrison-worker
      initContainers:
        - name: wait-for-server
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              echo "waiting for garrison-server health"
              until curl -fsS -o /dev/null http://garrison-server:8700/v1.0/api/health; do sleep 2; done
              echo "garrison-server healthy"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: worker
          image: jchristn77/garrison-worker
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 8710
            - name: metrics
              containerPort: 9465
          env:
            - name: GARRISON_WORKER_SETTINGS_FILE
              value: /etc/garrison/garrison-worker.json
            - name: GARRISON_WORKER_SERVER_URL
              value: http://garrison-server:8700
            - name: GARRISON_WORKER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GARRISON_WORKER_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garrison-node-credential
                  key: access-key
            - name: GARRISON_WORKER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garrison-node-credential
                  key: secret-key
            - name: GARRISON_WORKER_MAX_CONCURRENT_RUNS
              value: "4"
            - name: GARRISON_WORKER_WORK_ROOT
              value: /workspaces
            - name: GARRISON_WORKER_HEALTH_PORT
              value: "8710"
            - name: GARRISON_WORKER_LABELS
              value: garrison.io/pool=default
            - name: GARRISON_WORKER_NODE_POOL
              value: default
          volumeMounts:
            - name: settings
              mountPath: /etc/garrison
              readOnly: true
            - name: workspaces
              mountPath: /workspaces
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8710/health/live"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 24
            successThreshold: 1
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8710/health/ready"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
            successThreshold: 2
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8710/health/live"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
      volumes:
        - name: settings
          configMap:
            name: garrison-worker-settings
  volumeClaimTemplates:
    - metadata:
        name: workspaces
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
