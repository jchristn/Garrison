apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# overlays/k3s with two worker pools (components/worker-pools): the default pool for Claude Code, Codex, and Gemini,
# and a Mux pool. kubectl apply -k k8s/overlays/k3s-worker-pools
resources:
  - ../k3s

components:
  - ../../components/worker-pools
