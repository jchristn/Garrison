apiVersion: v1
kind: Service
metadata:
  name: garrison-server
spec:
  type: NodePort
  ports:
    - name: http
      port: 8700
      targetPort: http
      nodePort: 30870
    - name: mcp
      port: 8701
      targetPort: mcp
      nodePort: 30871
    - name: metrics
      port: 9464
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: garrison-dashboard
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30880
