apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: garrison

# minikube: in-cluster Postgres, NodePort services, reduced resource requests. Images are built straight into
# minikube's image store by k8s/scripts/deploy-minikube.sh, so pulls are skipped.
resources:
  - ../../base

components:
  - ../../components/postgres

patches:
  - path: nodeports.yaml
  - path: resources.yaml
