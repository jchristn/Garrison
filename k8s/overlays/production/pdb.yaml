apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garrison-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-server
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: garrison-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garrison-worker
