apiVersion: apps/v1
kind: Deployment
metadata:
  name: garrison-server
spec:
  replicas: 3
  template:
    spec:
      # Spread replicas across zones and hosts, and prefer never to put two on one host. All soft, so a small
      # cluster still schedules three replicas; switch to DoNotSchedule / requiredDuringScheduling once you have at
      # least as many nodes (and zones) as replicas. The hostname constraint comes from the base.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: garrison-server
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garrison-server
      initContainers:
        - name: wait-for-database
          env:
            - name: GARRISON_DB_HOST
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: host
            - name: GARRISON_DB_PORT
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: port
      containers:
        - name: server
          env:
            - name: GARRISON_DB_HOST
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: host
            - name: GARRISON_DB_PORT
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: port
            - name: GARRISON_DB_DATABASE
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: database
            - name: GARRISON_DB_USERNAME
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: username
            - name: GARRISON_DB_PASSWORD
              value: null
              valueFrom:
                secretKeyRef:
                  name: garrison-db
                  key: password
            - name: GARRISON_EXPECTED_REPLICAS
              value: "3"
            # Up to 10 replicas (hpa.yaml) x (20 + 2) + 13 = 233 connections: give the external PostgreSQL a
            # max_connections of at least 250 (docs/SCALING.md, "Database connections").
            - name: GARRISON_DB_MAX_POOL_SIZE
              value: "20"
            # What A2A agent cards advertise. Match the Ingress host.
            - name: GARRISON_EXTERNAL_BASE_URL
              value: https://garrison.example.com
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
