apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# overlays/production plus the HPA custom metrics (request rate and active runs) served by Prometheus Adapter.
# Install the adapter first (components/hpa-custom-metrics/kustomization.yaml has the steps). Copy this into your
# own overlay rather than applying it as is, so the production edits (host, image tags) live in one place.
resources:
  - ../production

components:
  - ../../components/hpa-custom-metrics
