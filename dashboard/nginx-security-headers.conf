# Security headers for every dashboard response (SR-25). Included at server level and again in each location that sets
# its own add_header, because nginx drops inherited add_header directives in a location that has any of its own.
#
# The Content-Security-Policy allows only this origin for scripts, styles, fonts, and frames, images from this origin,
# data: URLs, and blob: URLs (the PNG chart export draws an SVG blob), and API calls to this origin plus
# $garrison_csp_connect: the origin of GARRISON_API_URL (http and ws) and anything in GARRISON_CSP_CONNECT_SRC, written
# at container start by docker-entrypoint.sh. Remote images are blocked, so prompt-injected run output rendered as
# Markdown cannot send data out through an image URL. The dashboard needs no inline scripts or inline style elements
# (React sets styles through the DOM, which style-src does not restrict), so neither is allowed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'$garrison_csp_connect; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
