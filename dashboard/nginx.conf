# Garrison dashboard. Serves the single-page app and proxies the Garrison API so the browser can use one origin.
# /etc/nginx/garrison-upstream.inc is written at container start from GARRISON_API_UPSTREAM.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/garrison-upstream.inc;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location /v1.0/ {
        proxy_pass $garrison_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    location = /openapi.json {
        proxy_pass $garrison_api;
        proxy_set_header Host $host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
