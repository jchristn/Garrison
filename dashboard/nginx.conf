# Garrison dashboard. Serves the operator console at /, the agentic app UI at /apps/{slug}/ (AD-020), and proxies the
# Garrison API under /v1.0/ (including the app gateway, /v1.0/apps/{slug}/...) so the browser can use one origin.
# /etc/nginx/garrison-upstream.inc is written at container start from GARRISON_API_UPSTREAM, GARRISON_API_URL, and
# GARRISON_CSP_CONNECT_SRC. /etc/nginx/garrison-security-headers.inc (nginx-security-headers.conf in the repository)
# sets the Content-Security-Policy, X-Frame-Options, X-Content-Type-Options, and Referrer-Policy headers (SR-25).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/garrison-upstream.inc;
    include /etc/nginx/garrison-security-headers.inc;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        include /etc/nginx/garrison-security-headers.inc;
        try_files /config.js =404;
    }

    location /v1.0/ {
        proxy_pass $garrison_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    location = /openapi.json {
        proxy_pass $garrison_api;
        proxy_set_header Host $host;
    }

    # App UI (app-ui/ in the repository). One build serves every app: index.html reads the slug from the path. Hashed
    # bundles live under /apps/_ui/, a name no app slug can take (slugs are lowercase letters, digits, and hyphens);
    # every other path under /apps/ that is not a file gets the app UI's index.html (SPA fallback).
    location = /apps/config.js {
        add_header Cache-Control "no-store";
        include /etc/nginx/garrison-security-headers.inc;
        try_files /apps/config.js =404;
    }

    location /apps/_ui/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/garrison-security-headers.inc;
        try_files $uri =404;
    }

    location /apps/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/garrison-security-headers.inc;
        try_files $uri /apps/index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/garrison-security-headers.inc;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/garrison-security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
