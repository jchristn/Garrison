# Reference converter agent (AD10.1). Converts Markdown to Word or PDF, and Word to PDF, with a reference document
# for styling. Copy this bundle as a template for your own converter.
#
# Needs a worker with pandoc and LibreOffice: build the worker image with --build-arg INCLUDE_DOC_TOOLS=true. The agent
# names both tools as capabilities, so its runs wait for such a worker (blockedReason NoToolWorker) instead of failing.
#
# Input (JSON): {"source": "files/report.md", "target": "files/report.pdf", "template": "assets/report-template/reference.docx"}
# Output (JSON): {"resultPath": "files/report.pdf", "warnings": []}
apiVersion: garrison/v1
kind: HarnessProfile
metadata:
  name: pandoc-converter
  description: Runs a fixed conversion script with pandoc and LibreOffice; the input fields are passed as arguments, never as shell text
spec:
  harnessType: Generic
  executable: sh
  promptDelivery: Stdin
  outputParser: PlainText
  resultSource: Stdout
  defaultTimeoutSeconds: 300
  arguments:
    - template: -c
    - template: |
        # Converter script run by the pandoc-converter harness profile (see doc-converter.yaml). Arguments, in order:
        # source path, target path, reference document path (may be empty), base font size (may be empty). Paths are relative to
        # the run's working directory; the conversation file space is mounted at files/.
        set -eu
        src="$1"; out="$2"; ref="${3:-}"; size="${4:-}"
        warnings=""
        if [ ! -f "$src" ]; then
          printf '{"resultPath":"","warnings":["Source %s does not exist."]}\n' "$src"
          exit 2
        fi
        mkdir -p "$(dirname "$out")"
        if [ -n "$size" ] && [ -z "$ref" ]; then
          warnings="\"baseFontSize needs a reference document with that size; it was ignored.\""
        fi
        case "$out" in
          *.pdf)
            tmp="${out%.pdf}.docx"
            if [ -n "$ref" ]; then pandoc "$src" -o "$tmp" --reference-doc="$ref"; else pandoc "$src" -o "$tmp"; fi
            soffice --headless --convert-to pdf --outdir "$(dirname "$out")" "$tmp" > /dev/null
            rm -f "$tmp"
            ;;
          *)
            if [ -n "$ref" ]; then pandoc "$src" -o "$out" --reference-doc="$ref"; else pandoc "$src" -o "$out"; fi
            ;;
        esac
        printf '{"resultPath":"%s","warnings":[%s]}\n' "$out" "$warnings"
    - template: convert
    - template: "{{input.fields.source}}"
    - template: "{{input.fields.target}}"
    - template: "{{input.fields.template}}"
    - template: "{{input.fields.baseFontSize}}"
  assetPlacements:
    - kind: DocumentTemplate
      pathTemplate: "assets/{{asset.name}}"
    - kind: Skill
      pathTemplate: "assets/{{asset.name}}"
---
apiVersion: garrison/v1
kind: AgentAsset
metadata:
  name: report-template
spec:
  kind: DocumentTemplate
  description: Reference document with the report styles (pandoc's default reference.docx; edit its styles to restyle every report)
  files:
    - path: reference.docx
      mediaType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
      contentBase64: 
---
apiVersion: garrison/v1
kind: AgentAsset
metadata:
  name: doc-converter-skills
spec:
  kind: Skill
  description: How to convert documents with pandoc and LibreOffice, for an agent that converts with its own harness tools
  files:
    - path: SKILL.md
      content: |
        ---
        name: document-conversion
        description: Convert Markdown to Word or PDF with a reference document, and convert Word to PDF, using pandoc and LibreOffice.
        ---

        # Document conversion

        - Markdown to Word: `pandoc report.md -o report.docx --reference-doc=assets/report-template/reference.docx`. The reference document carries fonts, sizes, and heading styles; change those in the reference document, not in the Markdown.
        - Word to PDF: `soffice --headless --convert-to pdf --outdir out report.docx`.
        - Markdown to PDF: convert to Word with the reference document first, then to PDF, so the PDF keeps the Word styling.
        - Write results into the conversation file space (`files/`), so the person and other agents can download them.
        - Report the result path and anything you could not honor (for example a font size with no reference document) as warnings.
---
apiVersion: garrison/v1
kind: Agent
metadata:
  name: doc-converter
  description: Converts a Markdown file to Word or PDF, or Word to PDF, with an optional reference document for styling
spec:
  displayName: Document converter
  inputSchema: {"type": "object", "properties": {"source": {"type": "string", "description": "Source file path, for example files/report.md"}, "target": {"type": "string", "description": "Result path ending in .docx or .pdf, for example files/report.pdf"}, "template": {"type": "string", "description": "Optional reference document path, for example assets/report-template/reference.docx"}, "baseFontSize": {"type": "string", "description": "Optional base font size in points; honored only through a reference document"}}, "required": ["source", "target"]}
  outputSchema: {"type": "object", "properties": {"resultPath": {"type": "string"}, "warnings": {"type": "array", "items": {"type": "string"}}}, "required": ["resultPath", "warnings"]}
  capabilities: [pandoc, libreoffice]
  assets:
    - asset: report-template
    - asset: doc-converter-skills
---
apiVersion: garrison/v1
kind: Deployment
metadata:
  name: doc-converter-dev
spec:
  agent: doc-converter
  harnessProfile: pandoc-converter
  environment: dev
