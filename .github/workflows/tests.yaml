name: Backend smoke

# Broad provider/framework/adapter validation stays local; see docs/CI.md.
on:
  push:
    branches: ["**"]
    paths:
      - 'src/**'
      - 'sdk/csharp/**'
      - '.github/workflows/tests.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GARRISON_TEST_PROVIDERS: sqlite
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build .NET 10
        run: dotnet build src/Garrison.sln -f net10.0 -warnaserror
      - name: Focused smoke suites
        run: dotnet run --project src/Test.Automated -f net10.0 --no-build -- --suites templates,parsers,outcomes,identity-unit,worker-host --results results-smoke.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke
          path: results-smoke.json
          retention-days: 3
