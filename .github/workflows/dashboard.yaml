name: Dashboard

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test --if-present
      - name: Build
        run: npm run build
      - name: Docker build
        run: docker build -t garrison-dashboard:ci .
