name: Dashboard smoke

on:
  push:
    branches: ["**"]
    paths:
      - 'dashboard/**'
      - '.github/workflows/dashboard.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Focused smoke tests
        run: npm test -- src/tests/m1.test.js src/tests/runGuards.test.js src/tests/utils.test.js
      - name: Build
        run: npm run build
