name: App UI

on:
  push:
    branches: ["**"]
    paths:
      - 'app-ui/**'
      - 'sdk/js/**'
      - '.github/workflows/app-ui.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app-ui/package-lock.json
            sdk/js/package-lock.json
      # postinstall builds the JavaScript SDK (sdk/js), whose gateway entry point is the app UI's gateway client.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests (mock gateway)
        run: npx playwright install --with-deps chromium && npm run test:e2e
