name: Kubernetes

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Chart files mirror the Kustomize base
        run: |
          set -e
          for f in agents.yaml deployment-claude.yaml deployment-codex.yaml deployment-mux.yaml; do diff k8s/base/manifests/$f k8s/helm/garrison/files/$f; done
          diff k8s/base/scripts/bootstrap.sh k8s/helm/garrison/files/bootstrap.sh
          diff k8s/base/config/garrison.json k8s/helm/garrison/files/garrison.json
          diff k8s/base/config/garrison-worker.json k8s/helm/garrison/files/garrison-worker.json
          diff k8s/components/smoke-test/smoke.yaml k8s/helm/garrison/files/smoke.yaml
          diff k8s/components/smoke-test/smoke.sh k8s/helm/garrison/files/smoke.sh
          diff -r k8s/components/observability/config k8s/helm/garrison/files/observability --exclude=dashboards
          diff -r k8s/components/observability/dashboards k8s/helm/garrison/files/observability/dashboards
      - name: Render overlays and chart
        run: |
          set -e
          mkdir -p rendered
          for o in minikube k3s production smoke-test k3s-observability minikube-observability k3s-worker-pools production-custom-metrics; do kubectl kustomize k8s/overlays/$o > rendered/kustomize-$o.yaml; done
          # Components without an overlay of their own, rendered on top of an overlay (paths must be relative).
          mkdir -p k8s/.ci
          printf 'resources: [../overlays/k3s]\ncomponents: [../components/postgres-backup]\n' > k8s/.ci/kustomization.yaml
          kubectl kustomize k8s/.ci > rendered/kustomize-k3s-postgres-backup.yaml
          printf 'resources: [../overlays/production]\ncomponents: [../components/worker-pools]\n' > k8s/.ci/kustomization.yaml
          kubectl kustomize k8s/.ci > rendered/kustomize-production-worker-pools.yaml
          rm -rf k8s/.ci
          # Scale-test install (k8s/tests/overlay wrapped by deploy.sh), at the laptop and the full plan sizes.
          DRY_RUN=1 bash k8s/tests/deploy.sh && cp k8s/tests/.work/deploy/rendered.yaml rendered/tests-default.yaml
          DRY_RUN=1 SERVERS=3 WORKERS=10 WORKER_CONCURRENCY=8 bash k8s/tests/deploy.sh && cp k8s/tests/.work/deploy/rendered.yaml rendered/tests-full.yaml
          for v in values-minikube values-k3s values-production; do
            helm lint k8s/helm/garrison -f k8s/helm/garrison/$v.yaml
            helm lint k8s/helm/garrison -f k8s/helm/garrison/$v.yaml -f k8s/helm/garrison/values-worker-pools.yaml
            helm template garrison k8s/helm/garrison -n garrison -f k8s/helm/garrison/$v.yaml --set smokeTest.enabled=true > rendered/helm-$v.yaml
            helm template garrison k8s/helm/garrison -n garrison -f k8s/helm/garrison/$v.yaml --set observability.enabled=true > rendered/helm-$v-observability.yaml
            helm template garrison k8s/helm/garrison -n garrison -f k8s/helm/garrison/$v.yaml -f k8s/helm/garrison/values-worker-pools.yaml > rendered/helm-$v-worker-pools.yaml
          done
          helm lint k8s/helm/garrison
          helm template garrison k8s/helm/garrison -n garrison -f k8s/helm/garrison/values-production.yaml \
            --set server.hpa.customMetrics.requestsPerSecond.enabled=true --set server.hpa.customMetrics.runsActive.enabled=true \
            --set server.podAntiAffinity=hard > rendered/helm-values-production-custom-metrics.yaml
      - name: Validate with kubeconform
        run: docker run --rm -v "$PWD/rendered:/r:ro" ghcr.io/yannh/kubeconform:latest -strict -summary -kubernetes-version 1.31.0 /r
      - name: Scale-test scripts and load generator
        run: |
          set -e
          for f in k8s/tests/*.sh; do bash -n "$f"; done
          dotnet build k8s/tests/loadgen -f net10.0 -nologo
      - name: Validate Docker Compose
        run: |
          set -e
          docker compose -f docker/compose.yaml config -q
          docker compose -f docker/compose.yaml --profile observability config -q
          docker compose -f docker/compose.yaml -f docker/compose.observability.yaml --profile observability config -q
          bash -n docker/update.sh
          bash -n docker/factory/reset.sh
          diff docker/worker/garrison-worker.json k8s/base/config/garrison-worker.json

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Start K3S in Docker
        run: |
          docker run -d --name garrison-k3s --privileged -p 6443:6443 rancher/k3s:v1.31.4-k3s1 server --disable traefik
          for i in $(seq 1 60); do docker exec garrison-k3s kubectl get nodes >/dev/null 2>&1 && break; sleep 5; done
          docker cp garrison-k3s:/etc/rancher/k3s/k3s.yaml k3s.yaml
          echo "KUBECONFIG=$PWD/k3s.yaml" >> "$GITHUB_ENV"
      - name: Deploy (images built locally and imported)
        env:
          K3S_CONTAINER: garrison-k3s
        run: bash k8s/scripts/deploy-k3s.sh --build
      - name: Smoke test
        run: bash k8s/scripts/smoke-test.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n garrison get pods -o wide || true
          kubectl -n garrison logs deployment/garrison-server --tail=200 || true
          kubectl -n garrison logs statefulset/garrison-worker --tail=200 || true
          kubectl -n garrison logs job/garrison-bootstrap || true
