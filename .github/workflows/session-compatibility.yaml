name: Recorded session compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Garrison.Worker/**'
      - 'src/Garrison.ProviderHarness/**'
      - 'src/Garrison.Core/Seed/HarnessProfiles/**'
      - 'src/Test.Shared/Fixtures/Sessions/**'
      - 'scripts/session-compatibility/**'
      - 'scripts/check-session-compatibility.sh'
      - '.github/workflows/session-compatibility.yaml'

permissions:
  contents: read

jobs:
  installed-cli-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include-gemini: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Build candidate pinned harness image
        run: docker build --build-arg INCLUDE_GEMINI=${{ matrix.include-gemini }} -f src/Garrison.Worker/Dockerfile -t garrison-session-compatibility:local .
      - name: Resume existing installed CLI recordings without network or credentials
        env:
          GARRISON_SESSION_GEMINI: ${{ matrix.include-gemini }}
        run: scripts/check-session-compatibility.sh
