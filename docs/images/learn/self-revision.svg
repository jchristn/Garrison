<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="797.74" height="894" class="lg-svg" viewBox="0 0 798 894" role="group" aria-labelledby="lg-selfRevision-title" aria-describedby="lg-selfRevision-desc" direction="ltr" data-dir="ltr" data-diagram="selfRevision"><title id="lg-selfRevision-title">Self-revision</title><desc id="lg-selfRevision-desc">An executive writes a draft. Hard limits refuse it or pass it to the change rules, which an eval gate can hold back. A covered draft applies, anything else waits for a person who sees shadow and canary evidence. Each apply publishes an organization revision with a revert draft, and a rollback restores it. Executive → Draft: writes Draft → Hard limits: checked Hard limits → Refused: breaks a limit Hard limits → Change rules: passes Eval gate → Change rules: score Change rules → A person decides: not covered Change rules → Apply: fully covered A person decides → Apply: allows Shadow trials and canaries → A person decides: evidence Apply → Organization revision: publishes Organization revision → Revert draft: saves Rollback → Organization revision: restores</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-selfRevision-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="798" height="894" rx="10" ry="10"></rect><g class="lg-arrow" data-arrow="writes"><path d="M384,136 L384,184.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="361.52" y="151" width="45.00000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="384.02" y="164.96">writes</tspan></text></g></g><g class="lg-arrow" data-arrow="checked"><path d="M384,259 L384,307.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="356.46" y="274" width="55.120000000000005" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="384.02" y="287.96">checked</tspan></text></g></g><g class="lg-arrow" data-arrow="breaks"><path d="M482,362 L584.2,362" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="492.02" y="352" width="83.72" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="533.88" y="365.96">breaks a limit</tspan></text></g></g><g class="lg-arrow" data-arrow="passes"><path d="M384,415 L384,463.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="359.53999999999996" y="430" width="48.96" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="384.02" y="443.96">passes</tspan></text></g></g><g class="lg-arrow lg-arrow--dashed" data-arrow="gate"><path d="M212,525 L284.5,525" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="228.82" y="515" width="40.38" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="249.01" y="528.96">score</tspan></text></g></g><g class="lg-arrow" data-arrow="notCovered"><path d="M482,525 L584.2,525" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="497.85" y="515" width="72.06" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="533.88" y="528.96">not covered</tspan></text></g></g><g class="lg-arrow" data-arrow="covered"><path d="M344.8,585 L344.8,633.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="305.04999999999995" y="600" width="79.54000000000002" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="344.82" y="613.96">fully covered</tspan></text></g></g><g class="lg-arrow" data-arrow="allows"><path d="M634.7,585 L634.7,604 Q634.7,610 628.7,610 L429.2,610 Q423.2,610 423.2,616 L423.2,633.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="505.27000000000004" y="600" width="47.42" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="528.98" y="613.96">allows</tspan></text></g></g><g class="lg-arrow lg-arrow--dashed" data-arrow="evidence"><path d="M732.7,635 L732.7,586.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="703.3100000000001" y="600" width="58.86000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="732.74" y="613.96">evidence</tspan></text></g></g><g class="lg-arrow" data-arrow="publishes"><path d="M384,740 L384,788.5" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="352.71999999999997" y="755" width="62.599999999999994" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="384.02" y="768.96">publishes</tspan></text></g></g><g class="lg-arrow" data-arrow="saves"><path d="M482,834 L584.2,834" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="512.48" y="824" width="42.800000000000004" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="533.88" y="837.96">saves</tspan></text></g></g><g class="lg-arrow" data-arrow="restores"><path d="M212,834 L284.5,834" marker-end="url(#lg-selfRevision-head)"></path><g class="lg-arrow-label"><rect x="222" y="824" width="54.02" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="249.01" y="837.96">restores</tspan></text></g></g><g class="lg-box lg-box--core" data-box="executive"><a class="lg-link" href="../../EXECUTIVES.md#making-an-executive" aria-label="Executive. A unit lead whose deployment may draft changes below its unit."><rect class="lg-box-bg" x="286.02" y="16" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="40.18">Executive</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="59.64">A unit lead whose deployment</tspan><tspan x="384.02" y="74.64">may draft changes below its</tspan><tspan x="384.02" y="89.64">unit.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="384.02" y="107.78">managementAccess:</tspan><tspan x="384.02" y="121.78">OrgSubtree</tspan></text></a></g><g class="lg-box" data-box="draft"><a class="lg-link" href="../../EXECUTIVES.md#drafts-and-proposals" aria-label="Draft. An ordinary studio draft. People follow it as a proposal."><rect class="lg-box-bg" x="286.02" y="186" width="196" height="73" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="210.18">Draft</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="229.64">An ordinary studio draft. People</tspan><tspan x="384.02" y="244.64">follow it as a proposal.</tspan></text></a></g><g class="lg-box lg-box--check" data-box="limits"><a class="lg-link" href="../../EXECUTIVES.md#hard-limits" aria-label="Hard limits. Checked at diff, at request, and just before apply. No rule or approval lifts them."><rect class="lg-box-bg" x="286.02" y="309" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="333.18">Hard limits</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="352.64">Checked at diff, at request, and</tspan><tspan x="384.02" y="367.64">just before apply. No rule or</tspan><tspan x="384.02" y="382.64">approval lifts them.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="384.02" y="400.78">ExecutiveDraftValidator</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="refused"><a class="lg-link" href="../../EXECUTIVES.md#hard-limits" aria-label="Refused. The request fails with DraftInvalid, and nothing changes."><rect class="lg-box-bg" x="585.74" y="309" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="683.74" y="342.18">Refused</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="683.74" y="361.64">The request fails with</tspan><tspan x="683.74" y="376.64">DraftInvalid, and nothing</tspan><tspan x="683.74" y="391.64">changes.</tspan></text></a></g><g class="lg-box" data-box="eval"><a class="lg-link" href="../../EXECUTIVES.md#eval-gates" aria-label="Eval gate. The executive runs an eval set on its own draft. A gated rule needs a passing score."><rect class="lg-box-bg" x="16" y="465" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="496.18">Eval gate</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="515.64">The executive runs an eval set</tspan><tspan x="114" y="530.64">on its own draft. A gated rule</tspan><tspan x="114" y="545.64">needs a passing score.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="114" y="563.78">garrison_run_eval</tspan></text></a></g><g class="lg-box lg-box--check" data-box="rules"><a class="lg-link" href="../../EXECUTIVES.md#change-rules" aria-label="Change rules. Written only by people. Each change is sorted into classes and matched to a rule."><rect class="lg-box-bg" x="286.02" y="465" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="489.18">Change rules</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="508.64">Written only by people. Each</tspan><tspan x="384.02" y="523.64">change is sorted into classes</tspan><tspan x="384.02" y="538.64">and matched to a rule.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="384.02" y="556.78">ChangeClassifier ·</tspan><tspan x="384.02" y="570.78">ChangeRuleMatcher</tspan></text></a></g><g class="lg-box lg-box--actor" data-box="person"><a class="lg-link" href="../../EXECUTIVES.md#request-apply" aria-label="A person decides. A change no rule covers waits, like any draft."><rect class="lg-box-bg" x="585.74" y="465" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="683.74" y="512.68">A person decides</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="683.74" y="532.14">A change no rule covers waits,</tspan><tspan x="683.74" y="547.14">like any draft.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="apply"><a class="lg-link" href="../../EXECUTIVES.md#request-apply" aria-label="Apply. As the person behind the run, or the person who allowed it."><rect class="lg-box-bg" x="286.02" y="635" width="196" height="105" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="666.18">Apply</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="685.64">As the person behind the run, or</tspan><tspan x="384.02" y="700.64">the person who allowed it.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="384.02" y="718.78">DraftApply</tspan></text></a></g><g class="lg-box" data-box="evidence"><a class="lg-link" href="../../EVALS.md#shadow-trials" aria-label="Shadow trials and canaries. Started by people. Their results show on the proposal, and a canary rolls back by itself."><rect class="lg-box-bg" x="585.74" y="635" width="196" height="105" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="683.74" y="659.18">Shadow trials and</tspan><tspan x="683.74" y="676.18">canaries</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="683.74" y="695.64">Started by people. Their results</tspan><tspan x="683.74" y="710.64">show on the proposal, and a</tspan><tspan x="683.74" y="725.64">canary rolls back by itself.</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="rollback"><a class="lg-link" href="../../EXECUTIVES.md#revisions-revert-drafts-and-rollback" aria-label="Rollback. Restores an earlier revision, then applies the revert drafts, newest first."><rect class="lg-box-bg" x="16" y="790" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="814.18">Rollback</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="833.64">Restores an earlier revision,</tspan><tspan x="114" y="848.64">then applies the revert drafts,</tspan><tspan x="114" y="863.64">newest first.</tspan></text></a></g><g class="lg-box" data-box="revision"><a class="lg-link" href="../../ORGANIZATIONS.md#revisions-publish-and-rollback" aria-label="Organization revision. One per apply, naming the draft."><rect class="lg-box-bg" x="286.02" y="790" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="384.02" y="821.68">Organization revision</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="384.02" y="841.14">One per apply, naming the</tspan><tspan x="384.02" y="856.14">draft.</tspan></text></a></g><g class="lg-box" data-box="revert"><a class="lg-link" href="../../EXECUTIVES.md#revisions-revert-drafts-and-rollback" aria-label="Revert draft. The changed records as they were before."><rect class="lg-box-bg" x="585.74" y="790" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="683.74" y="821.68">Revert draft</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="683.74" y="841.14">The changed records as they</tspan><tspan x="683.74" y="856.14">were before.</tspan></text></a></g></svg>
