<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1075.6" height="422" class="lg-svg" viewBox="0 0 1076 422" role="group" aria-labelledby="lg-request-title" aria-describedby="lg-request-desc" direction="ltr" data-dir="ltr" data-diagram="request"><title id="lg-request-title">A request&#x27;s life</title><desc id="lg-request-desc">A request goes from the caller through REST, MCP, or A2A to run admission and the queue. A worker leases it and starts the harness, and the output comes back as events and a reply. Caller → REST, MCP, or A2A: request REST, MCP, or A2A → Run admission Run admission → Queued: admitted Queued → Lease: leased Lease → Harness: starts Harness → Events Events → Reply Reply → Caller: result</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-request-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="1076" height="422" rx="10" ry="10"></rect><g class="lg-group" data-group="controlPlane"><rect x="282.28" y="16" width="763.3199999999999" height="170" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="292.28" y="39.64">Control plane</tspan></text></g><g class="lg-group" data-group="worker"><rect x="548.28" y="236" width="497.31999999999994" height="170" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="558.28" y="259.64">On a worker node</tspan></text></g><g class="lg-arrow" data-arrow="sends"><path d="M212,111.5 L294.8,111.5" marker-end="url(#lg-request-head)"></path><g class="lg-arrow-label"><rect x="229" y="101.5" width="50.28" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="254.14" y="115.46">request</tspan></text></g></g><g class="lg-arrow" data-arrow="admit"><path d="M492.3,111.5 L560.8,111.5" marker-end="url(#lg-request-head)"></path></g><g class="lg-arrow" data-arrow="admitted"><path d="M758.3,111.5 L834.1,111.5" marker-end="url(#lg-request-head)"></path><g class="lg-arrow-label"><rect x="768.28" y="101.5" width="57.31999999999999" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="796.9399999999999" y="115.46">admitted</tspan></text></g></g><g class="lg-arrow" data-arrow="leased"><path d="M933.6,172 L933.6,269.5" marker-end="url(#lg-request-head)"></path><g class="lg-arrow-label"><rect x="910.3299999999999" y="211.5" width="46.540000000000006" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="933.5999999999999" y="225.46">leased</tspan></text></g></g><g class="lg-arrow" data-arrow="starts"><path d="M835.6,331.5 L759.8,331.5" marker-end="url(#lg-request-head)"></path><g class="lg-arrow-label"><rect x="776.0899999999999" y="321.5" width="41.7" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="796.9399999999999" y="335.46">starts</tspan></text></g></g><g class="lg-arrow" data-arrow="output"><path d="M562.3,331.5 L493.8,331.5" marker-end="url(#lg-request-head)"></path></g><g class="lg-arrow" data-arrow="finish"><path d="M296.3,331.5 L213.5,331.5" marker-end="url(#lg-request-head)"></path></g><g class="lg-arrow" data-arrow="returns"><path d="M114,271 L114,173.5" marker-end="url(#lg-request-head)"></path><g class="lg-arrow-label"><rect x="93.15" y="211.5" width="41.7" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="114" y="225.46">result</tspan></text></g></g><g class="lg-box lg-box--actor" data-box="caller"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="Caller. A person, an SDK, an MCP client, or an A2A agent."><rect class="lg-box-bg" x="16" y="51" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="99.18">Caller</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="118.64">A person, an SDK, an MCP</tspan><tspan x="114" y="133.64">client, or an A2A agent.</tspan></text></a></g><g class="lg-box" data-box="surface"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="REST, MCP, or A2A. All three use the same invoker, which checks Execute on the agent."><rect class="lg-box-bg" x="296.28" y="51" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="394.28" y="91.68">REST, MCP, or A2A</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="394.28" y="111.14">All three use the same invoker,</tspan><tspan x="394.28" y="126.14">which checks Execute on the</tspan><tspan x="394.28" y="141.14">agent.</tspan></text></a></g><g class="lg-box lg-box--check" data-box="admission"><a class="lg-link" href="../../BRAKES.md" aria-label="Run admission. Picks a deployment, then checks freezes, unit budgets, and queue limits. A refused run is never created."><rect class="lg-box-bg" x="562.28" y="51" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="660.28" y="75.18">Run admission</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="660.28" y="94.64">Picks a deployment, then</tspan><tspan x="660.28" y="109.64">checks freezes, unit budgets,</tspan><tspan x="660.28" y="124.64">and queue limits. A refused run</tspan><tspan x="660.28" y="139.64">is never created.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="660.28" y="157.78">RunService</tspan></text></a></g><g class="lg-box" data-box="queued"><a class="lg-link" href="../../TENANT_SCHEDULING.md" aria-label="Queued. Waits for a worker with the right harness, node pool, and labels."><rect class="lg-box-bg" x="835.5999999999999" y="51" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="933.5999999999999" y="91.68">Queued</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="933.5999999999999" y="111.14">Waits for a worker with the</tspan><tspan x="933.5999999999999" y="126.14">right harness, node pool, and</tspan><tspan x="933.5999999999999" y="141.14">labels.</tspan></text></a></g><g class="lg-box" data-box="reply"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="Reply. A waiting invoke returns the run. Streams get the final event."><rect class="lg-box-bg" x="16" y="271" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="311.68">Reply</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="331.14">A waiting invoke returns the</tspan><tspan x="114" y="346.14">run. Streams get the final</tspan><tspan x="114" y="361.14">event.</tspan></text></a></g><g class="lg-box" data-box="events"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="Events. Parsed output in batches: text, tool calls, usage, and the result."><rect class="lg-box-bg" x="296.28" y="271" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="394.28" y="311.68">Events</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="394.28" y="331.14">Parsed output in batches: text,</tspan><tspan x="394.28" y="346.14">tool calls, usage, and the</tspan><tspan x="394.28" y="361.14">result.</tspan></text></a></g><g class="lg-box" data-box="harness"><a class="lg-link" href="../../HARNESSES.md" aria-label="Harness. The CLI or provider API, started with the spec&#x27;s arguments, files, and MCP servers."><rect class="lg-box-bg" x="562.28" y="271" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="660.28" y="304.18">Harness</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="660.28" y="323.64">The CLI or provider API,</tspan><tspan x="660.28" y="338.64">started with the spec&#x27;s</tspan><tspan x="660.28" y="353.64">arguments, files, and MCP</tspan><tspan x="660.28" y="368.64">servers.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="lease"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="Lease. The worker long-polls, claims the run with a compare-and-set, and gets the compiled spec."><rect class="lg-box-bg" x="835.5999999999999" y="271" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="933.5999999999999" y="295.18">Lease</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="933.5999999999999" y="314.64">The worker long-polls, claims</tspan><tspan x="933.5999999999999" y="329.64">the run with a compare-and-</tspan><tspan x="933.5999999999999" y="344.64">set, and gets the compiled</tspan><tspan x="933.5999999999999" y="359.64">spec.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="933.5999999999999" y="377.78">ExecutionSpec</tspan></text></a></g></svg>
