<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="742.08" height="464" class="lg-svg" viewBox="0 0 743 464" role="group" aria-labelledby="lg-autonomy-title" aria-describedby="lg-autonomy-desc" direction="ltr" data-dir="ltr" data-diagram="autonomy"><title id="lg-autonomy-title">Autonomy building blocks</title><desc id="lg-autonomy-desc">A keeper holds a mandate whose wake schedule starts ticks. Each tick starts a keeper run, which writes memory, files reports, and raises escalations. An answered escalation wakes the keeper again. Keeper → Mandate: holds Mandate → Wake schedule: sets Wake schedule → Tick: comes due Tick → Keeper run: starts Keeper run → Memory: writes Keeper run → Report: files Keeper run → Escalation: raises Escalation → Tick: answer wakes it</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-autonomy-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="743" height="464" rx="10" ry="10"></rect><g class="lg-arrow" data-arrow="holds"><path d="M212,76.5 L270.9,76.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="222" y="66.5" width="40.38000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="242.19" y="80.46">holds</tspan></text></g></g><g class="lg-arrow" data-arrow="sets"><path d="M468.4,76.5 L528.6,76.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="482.12" y="66.5" width="34.220000000000006" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="499.23" y="80.46">sets</tspan></text></g></g><g class="lg-arrow" data-arrow="comesDue"><path d="M628.1,137 L628.1,185.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="594.1400000000001" y="152" width="67.88" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="628.08" y="165.96">comes due</tspan></text></g></g><g class="lg-arrow" data-arrow="starts"><path d="M530.1,247 L469.9,247" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="478.38" y="237" width="41.7" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="499.23" y="250.96">starts</tspan></text></g></g><g class="lg-arrow" data-arrow="writes"><path d="M311.6,307 L311.6,326 Q311.6,332 305.6,332 L120,332 Q114,332 114,338 L114,355.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="190.29" y="322" width="45.00000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="212.79" y="335.96">writes</tspan></text></g></g><g class="lg-arrow" data-arrow="files"><path d="M370.4,307 L370.4,355.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="352.61" y="322" width="35.540000000000006" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="370.38" y="335.96">files</tspan></text></g></g><g class="lg-arrow" data-arrow="raises"><path d="M429.2,307 L429.2,326 Q429.2,332 435.2,332 L582.9,332 Q588.9,332 588.9,338 L588.9,355.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="486.96999999999997" y="322" width="44.120000000000005" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="509.03" y="335.96">raises</tspan></text></g></g><g class="lg-arrow lg-arrow--dashed" data-arrow="answerWakes"><path d="M671.2,357 L671.2,308.5" marker-end="url(#lg-autonomy-head)"></path><g class="lg-arrow-label"><rect x="622.19" y="322" width="98.02000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="671.2" y="335.96">answer wakes it</tspan></text></g></g><g class="lg-box lg-box--core" data-box="keeper"><a class="lg-link" href="../../KEEPERS.md" aria-label="Keeper. An agent with a standing job. The API calls the record a mandate."><rect class="lg-box-bg" x="16" y="16" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="56.68">Keeper</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="76.14">An agent with a standing job.</tspan><tspan x="114" y="91.14">The API calls the record a</tspan><tspan x="114" y="106.14">mandate.</tspan></text></a></g><g class="lg-box" data-box="mandate"><a class="lg-link" href="../../KEEPERS.md#what-a-mandate-holds" aria-label="Mandate. Published revisions: the objective, what healthy looks like, autonomy, and escalation policy."><rect class="lg-box-bg" x="272.38" y="16" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="370.38" y="49.18">Mandate</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="370.38" y="68.64">Published revisions: the</tspan><tspan x="370.38" y="83.64">objective, what healthy looks</tspan><tspan x="370.38" y="98.64">like, autonomy, and escalation</tspan><tspan x="370.38" y="113.64">policy.</tspan></text></a></g><g class="lg-box" data-box="schedule"><a class="lg-link" href="../../KEEPERS.md#backoff" aria-label="Wake schedule. A minimum and maximum interval with backoff. The leader claims each due wake once."><rect class="lg-box-bg" x="530.08" y="16" width="196" height="121" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="628.08" y="40.18">Wake schedule</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="628.08" y="59.64">A minimum and maximum</tspan><tspan x="628.08" y="74.64">interval with backoff. The</tspan><tspan x="628.08" y="89.64">leader claims each due wake</tspan><tspan x="628.08" y="104.64">once.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="628.08" y="122.78">KeeperScheduler</tspan></text></a></g><g class="lg-box lg-box--core" data-box="run"><a class="lg-link" href="../../KEEPERS.md#a-tick-step-by-step" aria-label="Keeper run. A run of kind Keeper on the mandate&#x27;s deployment. It ends by reporting the tick."><rect class="lg-box-bg" x="272.38" y="187" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="370.38" y="211.18">Keeper run</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="370.38" y="230.64">A run of kind Keeper on the</tspan><tspan x="370.38" y="245.64">mandate&#x27;s deployment. It ends</tspan><tspan x="370.38" y="260.64">by reporting the tick.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="370.38" y="278.78">garrison_keeper_complete_-</tspan><tspan x="370.38" y="292.78">tick</tspan></text></a></g><g class="lg-box" data-box="tick"><a class="lg-link" href="../../KEEPERS.md#a-tick-step-by-step" aria-label="Tick. One wake, with its wake source and an outcome: Quiet, Acted, Attention, or Escalated."><rect class="lg-box-bg" x="530.08" y="187" width="196" height="120" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="628.08" y="227.18">Tick</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="628.08" y="246.64">One wake, with its wake</tspan><tspan x="628.08" y="261.64">source and an outcome: Quiet,</tspan><tspan x="628.08" y="276.64">Acted, Attention, or Escalated.</tspan></text></a></g><g class="lg-box" data-box="memory"><a class="lg-link" href="../../AGENT_MEMORY.md#recall-into-keeper-ticks" aria-label="Memory. Entries tagged recall come back in the next tick&#x27;s input."><rect class="lg-box-bg" x="16" y="357" width="196" height="91" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="390.18">Memory</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="409.64">Entries tagged recall come</tspan><tspan x="114" y="424.64">back in the next tick&#x27;s input.</tspan></text></a></g><g class="lg-box" data-box="report"><a class="lg-link" href="../../REPORTS.md" aria-label="Report. Filed upward. The manager&#x27;s next tick reads it in its digest."><rect class="lg-box-bg" x="272.38" y="357" width="196" height="91" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="370.38" y="381.18">Report</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="370.38" y="400.64">Filed upward. The manager&#x27;s</tspan><tspan x="370.38" y="415.64">next tick reads it in its digest.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="370.38" y="433.78">garrison_file_report</tspan></text></a></g><g class="lg-box lg-box--actor" data-box="escalation"><a class="lg-link" href="../../ESCALATIONS.md" aria-label="Escalation. A question for a person, a role, or another agent."><rect class="lg-box-bg" x="530.08" y="357" width="196" height="91" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="628.08" y="381.18">Escalation</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="628.08" y="400.64">A question for a person, a role,</tspan><tspan x="628.08" y="415.64">or another agent.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="628.08" y="433.78">garrison_escalate</tspan></text></a></g></svg>
