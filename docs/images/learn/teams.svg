<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1038.94" height="276" class="lg-svg" viewBox="0 0 1039 276" role="group" aria-labelledby="lg-teams-title" aria-describedby="lg-teams-desc" direction="ltr" data-dir="ltr" data-diagram="teams"><title id="lg-teams-title">Teams</title><desc id="lg-teams-desc">A message passes the loop guards into the recipient&#x27;s inbox, or is stored as Rejected. Normal mail waits for the recipient&#x27;s next run, and urgent mail wakes it. Sender → Loop guards: sends Loop guards → Inbox: passes Loop guards → Rejected: refused Inbox → Normal delivery: normal Inbox → Urgent wake: urgent Normal delivery → Recipient run: next run Urgent wake → Recipient run: wakes now</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-teams-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="1039" height="276" rx="10" ry="10"></rect><g class="lg-arrow" data-arrow="sends"><path d="M212,69 L273.3,69" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="222" y="59" width="42.800000000000004" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="243.4" y="72.96">sends</tspan></text></g></g><g class="lg-arrow" data-arrow="passes"><path d="M470.8,69 L538.3,69" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="480.79999999999995" y="59" width="48.96" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="505.28" y="72.96">passes</tspan></text></g></g><g class="lg-arrow" data-arrow="refused"><path d="M372.8,122 L372.8,170.5" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="347.66" y="137" width="50.28" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="372.8" y="150.96">refused</tspan></text></g></g><g class="lg-arrow" data-arrow="normal"><path d="M735.8,69 L825.4,69" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="757.64" y="59" width="47.42" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="781.35" y="72.96">normal</tspan></text></g></g><g class="lg-arrow" data-arrow="urgent"><path d="M637.8,122 L637.8,170.5" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="615.7" y="137" width="44.120000000000005" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="637.76" y="150.96">urgent</tspan></text></g></g><g class="lg-arrow" data-arrow="nextRun"><path d="M924.9,122 L924.9,170.5" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="898.1500000000001" y="137" width="53.58" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="924.94" y="150.96">next run</tspan></text></g></g><g class="lg-arrow" data-arrow="wakes"><path d="M735.8,216 L825.4,216" marker-end="url(#lg-teams-head)"></path><g class="lg-arrow-label"><rect x="745.76" y="206" width="71.18" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="781.35" y="219.96">wakes now</tspan></text></g></g><g class="lg-box lg-box--actor" data-box="sender"><a class="lg-link" href="../../MESSAGING.md#sending-and-reading" aria-label="Sender. An agent&#x27;s run, or a person. Agents write only along a line."><rect class="lg-box-bg" x="16" y="16" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="114" y="47.68">Sender</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="114" y="67.14">An agent&#x27;s run, or a person.</tspan><tspan x="114" y="82.14">Agents write only along a line.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="114" y="100.28">garrison_send_message</tspan></text></a></g><g class="lg-box lg-box--check" data-box="guards"><a class="lg-link" href="../../MESSAGING.md#loop-guards" aria-label="Loop guards. In order: recipient frozen, no line, hop limit, thread budget, line rate."><rect class="lg-box-bg" x="274.8" y="16" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="372.8" y="40.18">Loop guards</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="372.8" y="59.64">In order: recipient frozen, no</tspan><tspan x="372.8" y="74.64">line, hop limit, thread budget,</tspan><tspan x="372.8" y="89.64">line rate.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="372.8" y="107.78">MessageService</tspan></text></a></g><g class="lg-box lg-box--core" data-box="mailbox"><a class="lg-link" href="../../MESSAGING.md#delivery" aria-label="Inbox. The recipient&#x27;s queued messages, oldest first."><rect class="lg-box-bg" x="539.76" y="16" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="637.76" y="56.68">Inbox</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="637.76" y="76.14">The recipient&#x27;s queued</tspan><tspan x="637.76" y="91.14">messages, oldest first.</tspan></text></a></g><g class="lg-box" data-box="normal"><a class="lg-link" href="../../MESSAGING.md#delivery" aria-label="Normal delivery. Waits for the keeper&#x27;s next tick, or for a run that reads the inbox."><rect class="lg-box-bg" x="826.94" y="16" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="924.94" y="40.18">Normal delivery</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="924.94" y="59.64">Waits for the keeper&#x27;s next</tspan><tspan x="924.94" y="74.64">tick, or for a run that reads the</tspan><tspan x="924.94" y="89.64">inbox.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="924.94" y="107.78">garrison_read_inbox</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="rejected"><a class="lg-link" href="../../MESSAGING.md#loop-guards" aria-label="Rejected. Stored with its reason and never delivered."><rect class="lg-box-bg" x="274.8" y="172" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="372.8" y="203.68">Rejected</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="372.8" y="223.14">Stored with its reason and</tspan><tspan x="372.8" y="238.14">never delivered.</tspan></text></a></g><g class="lg-box" data-box="urgent"><a class="lg-link" href="../../MESSAGING.md#delivery" aria-label="Urgent wake. Brings the keeper&#x27;s next wake forward, or starts a Message run when there is no keeper."><rect class="lg-box-bg" x="539.76" y="172" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="637.76" y="196.18">Urgent wake</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="637.76" y="215.64">Brings the keeper&#x27;s next wake</tspan><tspan x="637.76" y="230.64">forward, or starts a Message</tspan><tspan x="637.76" y="245.64">run when there is no keeper.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="recipient"><a class="lg-link" href="../../MESSAGING.md#coalescing" aria-label="Recipient run. One run carries everything that arrived, so ten messages cost one tick."><rect class="lg-box-bg" x="826.94" y="172" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="924.94" y="196.18">Recipient run</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="924.94" y="215.64">One run carries everything that</tspan><tspan x="924.94" y="230.64">arrived, so ten messages cost</tspan><tspan x="924.94" y="245.64">one tick.</tspan></text></a></g></svg>
