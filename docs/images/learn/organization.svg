<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1012" height="448" class="lg-svg" viewBox="0 0 1012 448" role="group" aria-labelledby="lg-organization-title" aria-describedby="lg-organization-desc" direction="ltr" data-dir="ltr" data-diagram="organization"><title id="lg-organization-title">An organization</title><desc id="lg-organization-desc">The board oversees the root unit, whose lead is the CEO. Units below it are joined by reporting lines, and peer lines join units sideways. The working tree goes live when a revision is published, and the chain of command reads only the live revision. Board → Root unit: oversees Root unit → Unit: reporting line Root unit → Peer unit Unit ↔ Peer unit: peer line Working tree → Published revision: publish Published revision → Chain of command: read by</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-organization-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="1012" height="448" rx="10" ry="10"></rect><g class="lg-group" data-group="live"><rect x="16" y="139" width="728" height="293" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="26" y="162.64">Live revision</tspan></text></g><g class="lg-arrow" data-arrow="oversees"><path d="M380,89 L380,172.5" marker-end="url(#lg-organization-head)"></path><g class="lg-arrow-label"><rect x="350.57" y="121.5" width="58.86" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="380" y="135.46">oversees</tspan></text></g></g><g class="lg-arrow" data-arrow="reportsA"><path d="M340.8,262 L340.8,281 Q340.8,287 334.8,287 L134,287 Q128,287 128,293 L128,310.5" marker-end="url(#lg-organization-head)"></path><g class="lg-arrow-label"><rect x="193.97" y="277" width="80.86" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="234.4" y="290.96">reporting line</tspan></text></g></g><g class="lg-arrow" data-arrow="reportsB"><path d="M419.2,262 L419.2,281 Q419.2,287 425.2,287 L626,287 Q632,287 632,293 L632,310.5" marker-end="url(#lg-organization-head)"></path></g><g class="lg-arrow lg-arrow--dashed" data-arrow="peer"><path d="M227.5,365 L532.5,365" marker-end="url(#lg-organization-head)" marker-start="url(#lg-organization-head)"></path><g class="lg-arrow-label"><rect x="351.34000000000003" y="355" width="57.31999999999999" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="380" y="368.96">peer line</tspan></text></g></g><g class="lg-arrow" data-arrow="publish"><path d="M898,89 L898,172.5" marker-end="url(#lg-organization-head)"></path><g class="lg-arrow-label"><rect x="872.86" y="121.5" width="50.28" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="898" y="135.46">publish</tspan></text></g></g><g class="lg-arrow" data-arrow="readBy"><path d="M898,262 L898,310.5" marker-end="url(#lg-organization-head)"></path><g class="lg-arrow-label"><rect x="873.08" y="277" width="49.84" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="898" y="290.96">read by</tspan></text></g></g><g class="lg-box lg-box--actor" data-box="board"><a class="lg-link" href="../../BOARD.md" aria-label="Board. The people who run the organization, above the CEO."><rect class="lg-box-bg" x="282" y="16" width="196" height="73" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="380" y="40.18">Board</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="380" y="59.64">The people who run the</tspan><tspan x="380" y="74.64">organization, above the CEO.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="root"><a class="lg-link" href="../../ORGANIZATIONS.md#units" aria-label="Root unit. Its lead is the CEO. Its budget caps the whole tree."><rect class="lg-box-bg" x="282" y="174" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="380" y="205.68">Root unit</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="380" y="225.14">Its lead is the CEO. Its budget</tspan><tspan x="380" y="240.14">caps the whole tree.</tspan></text></a></g><g class="lg-box" data-box="unitA"><a class="lg-link" href="../../ORGANIZATIONS.md#units" aria-label="Unit. One lead, up to 200 members, and a Day and a Month budget."><rect class="lg-box-bg" x="30" y="312" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="128" y="352.68">Unit</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="128" y="372.14">One lead, up to 200 members,</tspan><tspan x="128" y="387.14">and a Day and a Month budget.</tspan></text></a></g><g class="lg-box" data-box="unitB"><a class="lg-link" href="../../ORGANIZATIONS.md#budgets" aria-label="Peer unit. A peer line joins every agent of two units, in both directions."><rect class="lg-box-bg" x="534" y="312" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="632" y="352.68">Peer unit</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="632" y="372.14">A peer line joins every agent of</tspan><tspan x="632" y="387.14">two units, in both directions.</tspan></text></a></g><g class="lg-box" data-box="working"><a class="lg-link" href="../../ORGANIZATIONS.md#the-working-tree-and-the-live-revision" aria-label="Working tree. Where people edit units. Nothing reads it at run time."><rect class="lg-box-bg" x="800" y="16" width="196" height="73" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="898" y="40.18">Working tree</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="898" y="59.64">Where people edit units.</tspan><tspan x="898" y="74.64">Nothing reads it at run time.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="revision"><a class="lg-link" href="../../ORGANIZATIONS.md#revisions-publish-and-rollback" aria-label="Published revision. A snapshot that never changes. A rollback publishes a copy of an earlier one."><rect class="lg-box-bg" x="800" y="174" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="898" y="198.18">Published revision</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="898" y="217.64">A snapshot that never changes.</tspan><tspan x="898" y="232.64">A rollback publishes a copy of</tspan><tspan x="898" y="247.64">an earlier one.</tspan></text></a></g><g class="lg-box lg-box--check" data-box="chain"><a class="lg-link" href="../../ORGANIZATIONS.md#the-chain-of-command" aria-label="Chain of command. Managers, chains, subtrees, and lines, from live revisions only."><rect class="lg-box-bg" x="800" y="312" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="898" y="336.18">Chain of command</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="898" y="355.64">Managers, chains, subtrees,</tspan><tspan x="898" y="370.64">and lines, from live revisions</tspan><tspan x="898" y="385.64">only.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="898" y="403.78">ChainOfCommand</tspan></text></a></g></svg>
