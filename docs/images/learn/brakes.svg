<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="581" class="lg-svg" viewBox="0 0 1040 581" role="group" aria-labelledby="lg-brakes-title" aria-describedby="lg-brakes-desc" direction="ltr" data-dir="ltr" data-diagram="brakes"><title id="lg-brakes-title">Brakes</title><desc id="lg-brakes-desc">Freezes, the kill switch, spend caps, and unit budgets feed the checks at run admission and before keeper wakes, which refuse new runs and skip wakes. For work already running, Cancel everything stops a unit&#x27;s subtree, and the budget guard freezes a unit that overruns. Freeze → Admission and wake checks Kill switch → Admission and wake checks Spend cap → Admission and wake checks Unit budget → Admission and wake checks Admission and wake checks → Refused run: new run Admission and wake checks → Skipped wake: keeper wake</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-brakes-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="1040" height="581" rx="10" ry="10"></rect><g class="lg-group" data-group="newWork"><rect x="30" y="16" width="980" height="389" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="40" y="39.64">Stops new work</tspan></text></g><g class="lg-group" data-group="inFlight"><rect x="30" y="425" width="980" height="140" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="40" y="448.64">Stops work already running</tspan></text></g><g class="lg-arrow" data-arrow="freeze"><path d="M142,157 L142,205.5" marker-end="url(#lg-brakes-head)"></path></g><g class="lg-arrow" data-arrow="killSwitch"><path d="M394,157 L394,205.5" marker-end="url(#lg-brakes-head)"></path></g><g class="lg-arrow" data-arrow="spendCap"><path d="M646,157 L646,205.5" marker-end="url(#lg-brakes-head)"></path></g><g class="lg-arrow" data-arrow="unitBudget"><path d="M898,157 L898,205.5" marker-end="url(#lg-brakes-head)"></path></g><g class="lg-arrow" data-arrow="refuses"><path d="M268,283 L268,331.5" marker-end="url(#lg-brakes-head)"></path><g class="lg-arrow-label"><rect x="241.43" y="298" width="53.14" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="268" y="311.96">new run</tspan></text></g></g><g class="lg-arrow" data-arrow="skips"><path d="M772,283 L772,331.5" marker-end="url(#lg-brakes-head)"></path><g class="lg-arrow-label"><rect x="733.11" y="298" width="77.78" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="772" y="311.96">keeper wake</tspan></text></g></g><g class="lg-box lg-box--stop" data-box="freeze"><a class="lg-link" href="../../BRAKES.md#freezes" aria-label="Freeze. Stops an agent, deployment, keeper, app, unit, or organization until a person lifts it."><rect class="lg-box-bg" x="44" y="51" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="142" y="76.68">Freeze</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="142" y="96.14">Stops an agent, deployment,</tspan><tspan x="142" y="111.14">keeper, app, unit, or</tspan><tspan x="142" y="126.14">organization until a person lifts</tspan><tspan x="142" y="141.14">it.</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="killSwitch"><a class="lg-link" href="../../BRAKES.md#the-kill-switch" aria-label="Kill switch. No keeper in the tenant wakes. Ordinary invocations keep working."><rect class="lg-box-bg" x="296" y="51" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="394" y="75.18">Kill switch</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="394" y="94.64">No keeper in the tenant wakes.</tspan><tspan x="394" y="109.64">Ordinary invocations keep</tspan><tspan x="394" y="124.64">working.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="394" y="142.78">TenantAutonomy</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="spendCap"><a class="lg-link" href="../../BRAKES.md#spend-caps" aria-label="Spend cap. A keeper&#x27;s budget per tick and per day. A spent day moves it to CapReached."><rect class="lg-box-bg" x="548" y="51" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="646" y="84.18">Spend cap</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="646" y="103.64">A keeper&#x27;s budget per tick and</tspan><tspan x="646" y="118.64">per day. A spent day moves it</tspan><tspan x="646" y="133.64">to CapReached.</tspan></text></a></g><g class="lg-box lg-box--stop" data-box="unitBudget"><a class="lg-link" href="../../BRAKES.md#unit-budgets" aria-label="Unit budget. A Day or Month cap on everything a unit&#x27;s subtree runs."><rect class="lg-box-bg" x="800" y="51" width="196" height="106" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="898" y="75.18">Unit budget</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="898" y="94.64">A Day or Month cap on</tspan><tspan x="898" y="109.64">everything a unit&#x27;s subtree</tspan><tspan x="898" y="124.64">runs.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="898" y="142.78">OrgBudgetGuard</tspan></text></a></g><g class="lg-box lg-box--check" data-box="checks"><a class="lg-link" href="../../ARCHITECTURE.md#brakes" aria-label="Admission and wake checks. Made in the control plane, never by the agent. A freeze reaches every replica through the backplane."><rect class="lg-box-bg" x="44" y="207" width="952" height="76" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="520" y="231.18">Admission and wake checks</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="520" y="250.64">Made in the control plane, never by the agent. A freeze reaches every replica through the backplane.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="520" y="268.78">RunService · KeeperScheduler · FreezeService</tspan></text></a></g><g class="lg-box" data-box="refused"><a class="lg-link" href="../../BRAKES.md#freezes" aria-label="Refused run. 409 Frozen or BudgetExhausted. Nothing is created."><rect class="lg-box-bg" x="44" y="333" width="448" height="58" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="268" y="357.18">Refused run</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="268" y="376.64">409 Frozen or BudgetExhausted. Nothing is created.</tspan></text></a></g><g class="lg-box" data-box="skipped"><a class="lg-link" href="../../KEEPERS.md#lifecycle" aria-label="Skipped wake. Recorded as a Skipped tick with its code, and the schedule moves on."><rect class="lg-box-bg" x="548" y="333" width="448" height="58" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="772" y="357.18">Skipped wake</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="772" y="376.64">Recorded as a Skipped tick with its code, and the schedule moves on.</tspan></text></a></g><g class="lg-box" data-box="cancelAll"><a class="lg-link" href="../../BRAKES.md#cancel-everything-in-a-unit" aria-label="Cancel everything. Cancels a unit subtree&#x27;s runs and ticks, withdraws its escalations, and expires its mail. It freezes nothing."><rect class="lg-box-bg" x="44" y="460" width="448" height="91" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="268" y="484.18">Cancel everything</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="268" y="503.64">Cancels a unit subtree&#x27;s runs and ticks, withdraws its escalations, and</tspan><tspan x="268" y="518.64">expires its mail. It freezes nothing.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="268" y="536.78">OrgBrakeService</tspan></text></a></g><g class="lg-box" data-box="autoFreeze"><a class="lg-link" href="../../BRAKES.md#automatic-freeze-on-a-budget-breach" aria-label="Automatic freeze. When a subtree spends its budget plus the margin, the guard freezes the unit and cancels its runs."><rect class="lg-box-bg" x="548" y="460" width="448" height="91" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="772" y="484.18">Automatic freeze</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="772" y="503.64">When a subtree spends its budget plus the margin, the guard freezes the unit</tspan><tspan x="772" y="518.64">and cancels its runs.</tspan></text><text class="lg-box-code" text-anchor="middle"><tspan x="772" y="536.78">OrgBudgetGuard</tspan></text></a></g></svg>
