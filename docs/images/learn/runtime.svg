<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="816.5600000000001" height="494" class="lg-svg" viewBox="0 0 817 494" role="group" aria-labelledby="lg-runtime-title" aria-describedby="lg-runtime-desc" direction="ltr" data-dir="ltr" data-diagram="runtime"><title id="lg-runtime-title">The runtime</title><desc id="lg-runtime-desc">A tenant holds credentials, agents, harness profiles, deployments, and runs. Node pools and worker nodes form a fleet that tenants share. Credential → Agent: invokes Agent → Deployment: runs on Harness profile → Deployment: used by Deployment → Node pool: targets Deployment → Run: creates Node pool → Worker node: groups Worker node → Run: leases</desc><style>.lg-svg{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','Noto Sans',sans-serif}.lg-group-label{font-size:11.5px;font-weight:600}.lg-box-bg{stroke-width:1}.lg-box-title{font-size:13px;font-weight:600}.lg-box-body{font-size:11.5px}.lg-box-code{font-size:10.5px;font-family:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace}.lg-arrow path{fill:none;stroke-width:1.4}.lg-arrow--dashed path{stroke-dasharray:5 4}.lg-arrowhead{stroke:none}.lg-arrow-label text{font-size:11px}.lg-bg{fill:#ffffff}.lg-group rect{fill:#f1f5f9;stroke:#e2e8f0}.lg-group-label{fill:#526178}.lg-box-bg{fill:#ffffff;stroke:#abb5c2}.lg-box--core .lg-box-bg{fill:#e9f3f2;stroke:#6ea9a9}.lg-box--actor .lg-box-bg{fill:#ebeffb;stroke:#7693e3}.lg-box--check .lg-box-bg{fill:#f5eee9;stroke:#b68c74}.lg-box--stop .lg-box-bg{fill:#f9ebeb;stroke:#cb787b}.lg-box-title{fill:#0f172a}.lg-box-body{fill:#475569}.lg-box-code{fill:#526178}.lg-arrow path{stroke:#526178}.lg-arrowhead{fill:#526178}.lg-arrow-label rect{fill:#ffffff;stroke:#e2e8f0}.lg-arrow-label text{fill:#475569}@media (prefers-color-scheme: dark){.lg-bg{fill:#111a2c}.lg-group rect{fill:#1a243a;stroke:#1f2b44}.lg-group-label{fill:#9aaac1}.lg-box-bg{fill:#111a2c;stroke:#4e5b74}.lg-box--core .lg-box-bg{fill:#142b39;stroke:#278888}.lg-box--actor .lg-box-bg{fill:#18273f;stroke:#436ea8}.lg-box--check .lg-box-bg{fill:#26292b;stroke:#987c32}.lg-box--stop .lg-box-bg{fill:#262232;stroke:#96525d}.lg-box-title{fill:#e2e8f0}.lg-box-body{fill:#cbd5e1}.lg-box-code{fill:#9aaac1}.lg-arrow path{stroke:#9aaac1}.lg-arrowhead{fill:#9aaac1}.lg-arrow-label rect{fill:#111a2c;stroke:#1f2b44}.lg-arrow-label text{fill:#cbd5e1}}</style><defs><marker id="lg-runtime-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="lg-arrowhead" d="M0,0.8 L10,5 L0,9.2 z"></path></marker></defs><rect class="lg-bg" x="0" y="0" width="817" height="494" rx="10" ry="10"></rect><g class="lg-group" data-group="tenant"><rect x="16" y="16" width="492.70000000000005" height="448" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="26" y="39.64">Tenant</tspan></text></g><g class="lg-group" data-group="fleet"><rect x="576.5600000000001" y="189" width="224" height="275" rx="10" ry="10"></rect><text class="lg-group-label" text-anchor="start"><tspan x="586.5600000000001" y="212.64">Shared fleet</tspan></text></g><g class="lg-arrow" data-arrow="invokes"><path d="M226,95 L297.2,95" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="236.00000000000003" y="85" width="52.70000000000001" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="262.35" y="98.96">invokes</tspan></text></g></g><g class="lg-arrow" data-arrow="runsOn"><path d="M396.7,139 L396.7,222.5" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="371.78000000000003" y="171.5" width="49.84" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="396.70000000000005" y="185.46">runs on</tspan></text></g></g><g class="lg-arrow" data-arrow="usedBy"><path d="M226,268 L297.2,268" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="236.22000000000003" y="258" width="52.260000000000005" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="262.35" y="271.96">used by</tspan></text></g></g><g class="lg-arrow" data-arrow="targets"><path d="M494.7,268 L589.1,268" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="518.7000000000002" y="258" width="47.86" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="542.6300000000001" y="271.96">targets</tspan></text></g></g><g class="lg-arrow" data-arrow="creates"><path d="M396.7,312 L396.7,360.5" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="371.56000000000006" y="327" width="50.28" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="396.70000000000005" y="340.96">creates</tspan></text></g></g><g class="lg-arrow" data-arrow="groups"><path d="M688.6,312 L688.6,360.5" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="665.2900000000001" y="327" width="46.540000000000006" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="688.5600000000001" y="340.96">groups</tspan></text></g></g><g class="lg-arrow" data-arrow="leases"><path d="M590.6,406 L496.2,406" marker-end="url(#lg-runtime-head)"></path><g class="lg-arrow-label"><rect x="519.3600000000001" y="396" width="46.540000000000006" height="20" rx="4" ry="4"></rect><text text-anchor="middle"><tspan x="542.6300000000001" y="409.96">leases</tspan></text></g></g><g class="lg-box lg-box--actor" data-box="credential"><a class="lg-link" href="../../SECURITY.md#identities" aria-label="Credential. An access key owned by a user. Callers and worker nodes sign in with one."><rect class="lg-box-bg" x="30" y="51" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="128" y="75.18">Credential</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="128" y="94.64">An access key owned by a</tspan><tspan x="128" y="109.64">user. Callers and worker nodes</tspan><tspan x="128" y="124.64">sign in with one.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="agent"><a class="lg-link" href="../../REVISIONS.md#revisions" aria-label="Agent. What callers invoke over REST, MCP, or A2A. It keeps immutable revisions."><rect class="lg-box-bg" x="298.70000000000005" y="51" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="396.70000000000005" y="75.18">Agent</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="396.70000000000005" y="94.64">What callers invoke over</tspan><tspan x="396.70000000000005" y="109.64">REST, MCP, or A2A. It keeps</tspan><tspan x="396.70000000000005" y="124.64">immutable revisions.</tspan></text></a></g><g class="lg-box" data-box="harnessProfile"><a class="lg-link" href="../../HARNESSES.md" aria-label="Harness profile. How one harness CLI or API runs headless. The dashboard calls it a connection."><rect class="lg-box-bg" x="30" y="224" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="128" y="248.18">Harness profile</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="128" y="267.64">How one harness CLI or API</tspan><tspan x="128" y="282.64">runs headless. The dashboard</tspan><tspan x="128" y="297.64">calls it a connection.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="deployment"><a class="lg-link" href="../../ARCHITECTURE.md#the-life-of-a-run" aria-label="Deployment. Binds an agent to a harness profile, a model, prompts, and a node pool."><rect class="lg-box-bg" x="298.70000000000005" y="224" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="396.70000000000005" y="248.18">Deployment</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="396.70000000000005" y="267.64">Binds an agent to a harness</tspan><tspan x="396.70000000000005" y="282.64">profile, a model, prompts, and</tspan><tspan x="396.70000000000005" y="297.64">a node pool.</tspan></text></a></g><g class="lg-box" data-box="nodePool"><a class="lg-link" href="../../TENANT_SCHEDULING.md" aria-label="Node pool. A group of worker nodes, optionally dedicated to tenants."><rect class="lg-box-bg" x="590.5600000000001" y="224" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="688.5600000000001" y="255.68">Node pool</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="688.5600000000001" y="275.14">A group of worker nodes,</tspan><tspan x="688.5600000000001" y="290.14">optionally dedicated to tenants.</tspan></text></a></g><g class="lg-box lg-box--core" data-box="run"><a class="lg-link" href="../../ARCHITECTURE.md#run-states" aria-label="Run. One execution of an agent on one deployment, with its events and result."><rect class="lg-box-bg" x="298.70000000000005" y="362" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="396.70000000000005" y="386.18">Run</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="396.70000000000005" y="405.64">One execution of an agent on</tspan><tspan x="396.70000000000005" y="420.64">one deployment, with its</tspan><tspan x="396.70000000000005" y="435.64">events and result.</tspan></text></a></g><g class="lg-box" data-box="node"><a class="lg-link" href="../../ARCHITECTURE.md#the-parts" aria-label="Worker node. Pulls the runs it can serve and starts the harness for each."><rect class="lg-box-bg" x="590.5600000000001" y="362" width="196" height="88" rx="8" ry="8"></rect><text class="lg-box-title" text-anchor="middle"><tspan x="688.5600000000001" y="393.68">Worker node</tspan></text><text class="lg-box-body" text-anchor="middle"><tspan x="688.5600000000001" y="413.14">Pulls the runs it can serve and</tspan><tspan x="688.5600000000001" y="428.14">starts the harness for each.</tspan></text></a></g></svg>
