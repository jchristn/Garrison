# Lane alpha: the base worker StatefulSet with the lane label (as a node label for scheduling and as a pod label for
# fault injection), small requests, and a two-minute drain (fake-harness runs take seconds).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garrison-worker
spec:
  replicas: 2
  template:
    metadata:
      labels:
        bench.garrison.io/lane: alpha
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          env:
            - name: GARRISON_WORKER_LABELS
              value: garrison.io/pool=default,bench.garrison.io/lane=alpha
          resources:
            requests:
              cpu: 50m
              memory: 160Mi
            limits:
              cpu: "2"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: workspaces
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
