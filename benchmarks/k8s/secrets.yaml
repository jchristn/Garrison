# Benchmark credentials. Obviously fake and committed on purpose: the bench cluster is throwaway, bound to 127.0.0.1,
# and runs only the fake harness. Never reuse these values anywhere else.
apiVersion: v1
kind: Secret
metadata:
  name: garrison-secrets
type: Opaque
stringData:
  master-key: garrison-benchmark-master-key-not-for-production
  signing-key: garrison-benchmark-signing-key-not-for-production
  admin-api-key: garrison-benchmark-admin-key-not-for-production
  admin-password: garrison-benchmark-password-not-for-production
  db-password: garrison-benchmark-db-password-not-for-production
  default-access-key: access_garrison_benchmark_not_for_production
  default-secret-key: secret_garrison_benchmark_not_for_production
---
apiVersion: v1
kind: Secret
metadata:
  name: garrison-node-credential
type: Opaque
stringData:
  access-key: access_garrison_benchmark_node_not_for_production
  secret-key: secret_garrison_benchmark_node_not_for_production
