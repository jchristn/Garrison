apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Benchmark install for the garrison-bench k3d cluster (benchmarks/stack-up.sh applies it). The shipped base and the
# in-cluster PostgreSQL component, unchanged except for what a benchmark needs:
#   - the server on NodePort 30870 (REST) and 30871 (MCP), which benchmarks/k3d/cluster.yaml publishes on
#     127.0.0.1:37870 and 127.0.0.1:37871
#   - two worker lanes: the base StatefulSet garrison-worker is lane alpha (2 replicas by default, the one the load
#     command scales), and garrison-worker-beta is lane beta (1 replica), told apart by the bench.garrison.io/lane label
#   - small resource requests so the stack fits a laptop, and a two-minute worker drain
#   - committed, obviously fake credentials (secrets.yaml) instead of generated ones
#   - no dashboard and no bootstrap Job (they add load and sample agents the benchmark does not use)
# Images: postgres:17, busybox:1.36, and curlimages/curl:8.10.1 as the base pins them; Garrison images built from the
# working tree with the tag bench-local.
namespace: garrison

resources:
  - ../../k8s/base
  - secrets.yaml
  - worker-beta.yaml

components:
  - ../../k8s/components/postgres

images:
  - name: jchristn77/garrison-server
    newTag: bench-local
  - name: jchristn77/garrison-worker
    newTag: bench-local
  - name: jchristn77/garrison-dashboard
    newTag: bench-local

patches:
  - path: server.yaml
  - path: worker.yaml
  - path: postgres.yaml
  - path: remove-unused.yaml
