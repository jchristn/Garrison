# Isolated benchmark stack: K3S in Docker (k3d), its own cluster name, its own kubeconfig, and a port block no other
# stack on this machine uses (37xxx; the k8s/tests scale tests use 6560/18870, the Docker Compose stack 8700 to 8710,
# and a running garrison-k3s cluster 16443/18080). Every published port is bound to 127.0.0.1.
#
#   k3d cluster create --config benchmarks/k3d/cluster.yaml      (benchmarks/stack-up.sh does this and more)
#
# The K3S image is pinned to the version the k8s/tests scale tests use; the Garrison images are built from the working
# tree and imported (tag bench-local), and postgres:17, busybox:1.36, and curlimages/curl:8.10.1 are the versions the
# shipped Kustomize base pins.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: garrison-bench
servers: 1
agents: 0
image: rancher/k3s:v1.31.4-k3s1
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "37443"
ports:
  - port: 127.0.0.1:37870:30870
    nodeFilters: [server:0:direct]
  - port: 127.0.0.1:37871:30871
    nodeFilters: [server:0:direct]
options:
  k3d:
    wait: true
    timeout: 300s
    disableLoadbalancer: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters: [server:*]
      - arg: --disable=servicelb
        nodeFilters: [server:*]
      - arg: --disable=metrics-server
        nodeFilters: [server:*]
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  runtime:
    serversMemory: 3g
