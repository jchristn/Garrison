# Prometheus configuration for the Docker Compose observability profile. The server serves /metrics on its REST
# port (8700) and each worker on its health port (8710), relayed from the dedicated metrics listener. The node label
# is the Garrison node name (GARRISON_NODE_ID for the server, GARRISON_WORKER_NODE_NAME for workers), so Grafana
# variables and dashboard deep links work the same way as on Kubernetes. Add a target here when you add a worker.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Keep the underscore metric names the dashboards use (see k8s/components/observability/config/prometheus.yaml).
  metric_name_validation_scheme: legacy

scrape_configs:
  - job_name: garrison
    metrics_path: /metrics
    static_configs:
      - targets: ["garrison-server:8700"]
        labels:
          component: server
          node: garrison-server
      - targets: ["garrison-worker-1:8710"]
        labels:
          component: worker
          node: garrison-worker-1
      - targets: ["garrison-worker-2:8710"]
        labels:
          component: worker
          node: garrison-worker-2

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
