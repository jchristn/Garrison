# Prometheus configuration for the Docker Compose observability profile. The server serves /metrics on its metrics
# listener (9464) and each worker on its own (9465). Those listeners answer only requests addressed to the
# container's host name, so every Garrison service sets hostname: to its service name and the targets use it.
# /metrics is not served on the REST port or the worker health port (Telemetry.ServeMetricsOnServicePort is false
# by default, since that endpoint is anonymous). The node label is the Garrison node name (GARRISON_NODE_ID for the
# server, GARRISON_WORKER_NODE_NAME for workers), so Grafana variables and dashboard deep links work the same way as
# on Kubernetes. Add a target here when you add a worker.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Keep the underscore metric names the dashboards use (see k8s/components/observability/config/prometheus.yaml).
  metric_name_validation_scheme: legacy

scrape_configs:
  - job_name: garrison
    # Application stages use component; retain their bounded metric labels on collisions.
    honor_labels: true
    metrics_path: /metrics
    static_configs:
      - targets: ["garrison-server:9464"]
        labels:
          component: server
          process_component: server
          node: garrison-server
      - targets: ["garrison-worker-1:9465"]
        labels:
          component: worker
          process_component: worker
          node: garrison-worker-1
      - targets: ["garrison-worker-2:9465"]
        labels:
          component: worker
          process_component: worker
          node: garrison-worker-2

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
