# Garrison on Docker Compose: one control-plane server, two workers, the dashboard, and Postgres.
#
#   cd docker
#   ./update.sh                 # first run: writes random keys and passwords to .env, then builds and starts
#
# Dashboard http://127.0.0.1:8080 (tenant default, admin@garrison, the GARRISON_ADMIN_PASSWORD from .env), REST
# http://127.0.0.1:8700, MCP http://127.0.0.1:8701/mcp. Every port is overridable in .env.
#
# Each Garrison service names its image (jchristn77/garrison-*:v0.2.0) AND has a build stanza, so
# `docker compose up` uses or pulls the named image and `docker compose up --build` (or update.sh) rebuilds it from
# this repository. Third-party images are pinned. Host ports bind 127.0.0.1 only. The keys, passwords, and seeded
# credentials have no defaults: Compose refuses to start until they are set in .env. update.sh, update.bat, and
# factory/reset generate any that are missing, and the server itself refuses the public built-in defaults (SR-08).
#
# update.sh / update.bat rebuild the images and recreate the stack without touching data.
# factory/reset.sh / factory/reset.bat delete all data (volumes) and start fresh.
#
# Observability starts with the application: Prometheus, Loki, Tempo, Grafana and Alloy share the Kubernetes
# provisioning files. Grafana uses GARRISON_GRAFANA_PASSWORD from .env; update scripts generate it.
# compose.observability.yaml remains a compatible explicit settings overlay for existing installations.

name: 'garrison'

x-worker: &worker
  image: 'jchristn77/garrison-worker:v0.2.0'
  build:
    context: '..'
    dockerfile: 'src/Garrison.Worker/Dockerfile'
  restart: 'unless-stopped'
  stop_grace_period: 60s
  depends_on:
    garrison-server:
      condition: service_healthy
  healthcheck:
    test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8710/health']
    interval: 5s
    timeout: 5s
    retries: 2
    start_period: 60s

x-worker-environment: &worker-environment
  GARRISON_WORKER_OTLP_ENABLE: '${GARRISON_WORKER_OTLP_ENABLE:-true}'
  GARRISON_WORKER_OTLP_ENDPOINT: 'http://garrison-alloy:4317'
  GARRISON_WORKER_SETTINGS_FILE: '/etc/garrison/garrison-worker.json'
  GARRISON_WORKER_SERVER_URL: 'http://garrison-server:8700'
  GARRISON_WORKER_CONTAINERIZED: 'true'
  GARRISON_WORKER_ACCESS_KEY: '${GARRISON_NODE_ACCESS_KEY:?set GARRISON_NODE_ACCESS_KEY in docker/.env (update.sh generates it)}'
  GARRISON_WORKER_SECRET_KEY: '${GARRISON_NODE_SECRET_KEY:?set GARRISON_NODE_SECRET_KEY in docker/.env (update.sh generates it)}'

services:

  # ------------------------------------------------------------------
  # Postgres: the control plane's database.
  # ------------------------------------------------------------------
  postgres:
    container_name: 'garrison-postgres'
    image: 'postgres:17'
    # Parallel queries need more than Docker's default 64 MiB shared-memory mount.
    shm_size: '256m'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${GARRISON_POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_DB: 'garrison'
      POSTGRES_USER: 'garrison'
      POSTGRES_PASSWORD: '${GARRISON_DB_PASSWORD:?set GARRISON_DB_PASSWORD in docker/.env (update.sh generates it)}'
    volumes:
      - garrison-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP check (-h 127.0.0.1) so the container is healthy only once Postgres accepts network connections.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U garrison -d garrison']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  # ------------------------------------------------------------------
  # Control plane: REST and A2A on 8700, MCP on 8701, metrics on 9464.
  # ------------------------------------------------------------------
  garrison-server:
    container_name: 'garrison-server'
    # The metrics listener (9464) answers only requests addressed to the container's host name, so Prometheus
    # scrapes garrison-server:9464. /metrics is not served on the REST port (Telemetry.ServeMetricsOnServicePort).
    hostname: 'garrison-server'
    image: 'jchristn77/garrison-server:v0.2.0'
    build:
      context: '..'
      dockerfile: 'src/Garrison.Server/Dockerfile'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${GARRISON_REST_PORT:-8700}:8700'
      - '127.0.0.1:${GARRISON_MCP_PORT:-8701}:8701'
    environment:
      GARRISON_OTLP_ENABLE: '${GARRISON_OTLP_ENABLE:-true}'
      GARRISON_OTLP_ENDPOINT: 'http://garrison-alloy:4317'
      GARRISON_GRAFANA_URL: 'http://127.0.0.1:${GARRISON_GRAFANA_PORT:-3000}'
      GARRISON_PROMETHEUS_URL: 'http://127.0.0.1:${GARRISON_PROMETHEUS_PORT:-9090}'
      GARRISON_LOKI_URL: 'http://127.0.0.1:${GARRISON_LOKI_PORT:-3100}'
      GARRISON_TEMPO_URL: 'http://127.0.0.1:${GARRISON_TEMPO_PORT:-3200}'
      GARRISON_GRAFANA_INTERNAL_URL: 'http://garrison-grafana:3000'
      GARRISON_PROMETHEUS_INTERNAL_URL: 'http://garrison-prometheus:9090'
      GARRISON_LOKI_INTERNAL_URL: 'http://garrison-loki:3100'
      GARRISON_TEMPO_INTERNAL_URL: 'http://garrison-tempo:3200'
      GARRISON_SETTINGS_FILE: '/etc/garrison/garrison.json'
      GARRISON_SETTINGS_READONLY: 'true'
      GARRISON_NODE_ID: 'garrison-server'
      GARRISON_DB_PASSWORD: '${GARRISON_DB_PASSWORD:?set GARRISON_DB_PASSWORD in docker/.env (update.sh generates it)}'
      GARRISON_MASTER_KEY: '${GARRISON_MASTER_KEY:?set GARRISON_MASTER_KEY in docker/.env (update.sh generates it)}'
      GARRISON_AUTH_SIGNING_KEY: '${GARRISON_AUTH_SIGNING_KEY:?set GARRISON_AUTH_SIGNING_KEY in docker/.env (update.sh generates it)}'
      GARRISON_ADMIN_API_KEY: '${GARRISON_ADMIN_API_KEY:?set GARRISON_ADMIN_API_KEY in docker/.env (update.sh generates it)}'
      GARRISON_ADMIN_EMAIL: '${GARRISON_ADMIN_EMAIL:-admin@garrison}'
      GARRISON_ADMIN_PASSWORD: '${GARRISON_ADMIN_PASSWORD:?set GARRISON_ADMIN_PASSWORD in docker/.env (update.sh generates it)}'
      # Development mode for a stack only you can reach: start with public default keys and passwords (docs/DOCKER.md).
      GARRISON_ALLOW_INSECURE_DEFAULTS: '${GARRISON_ALLOW_INSECURE_DEFAULTS:-false}'
      GARRISON_DEFAULT_ACCESS_KEY: '${GARRISON_DEFAULT_ACCESS_KEY:?set GARRISON_DEFAULT_ACCESS_KEY in docker/.env (update.sh generates it)}'
      GARRISON_DEFAULT_SECRET_KEY: '${GARRISON_DEFAULT_SECRET_KEY:?set GARRISON_DEFAULT_SECRET_KEY in docker/.env (update.sh generates it)}'
      GARRISON_NODE_ACCESS_KEY: '${GARRISON_NODE_ACCESS_KEY:?set GARRISON_NODE_ACCESS_KEY in docker/.env (update.sh generates it)}'
      GARRISON_NODE_SECRET_KEY: '${GARRISON_NODE_SECRET_KEY:?set GARRISON_NODE_SECRET_KEY in docker/.env (update.sh generates it)}'
      # Internal URLs: agents on the workers call back into Garrison (delegation) through these, so they use the
      # service name. They are never shown in A2A agent cards.
      GARRISON_MCP_PUBLIC_URL: 'http://garrison-server:8701'
      GARRISON_PUBLIC_BASE_URL: 'http://garrison-server:8700'
      # External URL: what A2A agent cards and server info advertise to people and clients outside the Compose
      # network. Defaults to the REST port published on the host.
      GARRISON_EXTERNAL_BASE_URL: '${GARRISON_EXTERNAL_BASE_URL:-http://127.0.0.1:${GARRISON_REST_PORT:-8700}}'
      GARRISON_EXPECTED_REPLICAS: '1'
      GARRISON_LEASE_PROVIDER: '${GARRISON_LEASE_PROVIDER:-Database}'
      GARRISON_CLUTCH_ENDPOINT: '${GARRISON_CLUTCH_ENDPOINT:-}'
      GARRISON_CLUTCH_ACCESS_KEY: '${GARRISON_CLUTCH_ACCESS_KEY:-}'
      GARRISON_CLUTCH_KEY_PREFIX: '${GARRISON_CLUTCH_KEY_PREFIX:-garrison}'

    volumes:
      - ./server/garrison.json:/etc/garrison/garrison.json:ro
      # Filesystem artifact stores and durable checkpoints under /app/data survive recreation.
      - garrison-server-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8700/v1.0/api/health']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  # ------------------------------------------------------------------
  # Workers: pull runs from the server and execute the harnesses.
  # ------------------------------------------------------------------
  garrison-worker-1:
    <<: *worker
    container_name: 'garrison-worker-1'
    hostname: 'garrison-worker-1'
    environment:
      <<: *worker-environment
      GARRISON_WORKER_NODE_NAME: 'garrison-worker-1'
    volumes:
      - ./worker/garrison-worker.json:/etc/garrison/garrison-worker.json:ro
      - garrison-worker-1-workspaces:/workspaces

  garrison-worker-2:
    <<: *worker
    container_name: 'garrison-worker-2'
    hostname: 'garrison-worker-2'
    environment:
      <<: *worker-environment
      GARRISON_WORKER_NODE_NAME: 'garrison-worker-2'
    volumes:
      - ./worker/garrison-worker.json:/etc/garrison/garrison-worker.json:ro
      - garrison-worker-2-workspaces:/workspaces

  # ------------------------------------------------------------------
  # Dashboard: nginx serving the React console and proxying /v1.0 to the server.
  # ------------------------------------------------------------------
  garrison-dashboard:
    container_name: 'garrison-dashboard'
    image: 'jchristn77/garrison-dashboard:v0.2.0'
    # Serves the operator console at / and the agentic app UI at /apps/{slug}/; builds from the repository root.
    build:
      context: '..'
      dockerfile: 'dashboard/Dockerfile'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${GARRISON_DASHBOARD_PORT:-8080}:80'
    environment:
      GARRISON_API_UPSTREAM: 'http://garrison-server:8700'
    depends_on:
      garrison-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 10s

  # ------------------------------------------------------------------
  # Bootstrap (runs once): stores harness credentials as Garrison secrets and applies the sample agents.
  # Same script and manifests as the Kubernetes bootstrap Job. Safe to re-run: docker compose up garrison-bootstrap
  # ------------------------------------------------------------------
  garrison-bootstrap:
    container_name: 'garrison-bootstrap'
    image: 'curlimages/curl:8.10.1'
    restart: 'no'
    entrypoint: ['sh', '/scripts/bootstrap.sh']
    environment:
      GARRISON_API_URL: 'http://garrison-server:8700'
      GARRISON_TENANT_ID: 'default'
      GARRISON_MANIFEST_DIR: '/manifests'
      GARRISON_ADMIN_API_KEY: '${GARRISON_ADMIN_API_KEY:?set GARRISON_ADMIN_API_KEY in docker/.env (update.sh generates it)}'
      ANTHROPIC_API_KEY: '${ANTHROPIC_API_KEY:-}'
      CLAUDE_CODE_OAUTH_TOKEN: '${CLAUDE_CODE_OAUTH_TOKEN:-}'
      OPENAI_API_KEY: '${OPENAI_API_KEY:-}'
      CODEX_AUTH_JSON_FILE: '/run/garrison/codex-auth.json'
      MUX_BASE_URL: '${MUX_BASE_URL:-}'
      MUX_MODEL: '${MUX_MODEL:-}'
      MUX_API_KEY: '${MUX_API_KEY:-}'
      MUX_ADAPTER_TYPE: '${MUX_ADAPTER_TYPE:-}'
      MUX_CONTEXT_WINDOW: '${MUX_CONTEXT_WINDOW:-}'
      MUX_MAX_TOKENS: '${MUX_MAX_TOKENS:-}'
    volumes:
      - ../k8s/base/scripts/bootstrap.sh:/scripts/bootstrap.sh:ro
      - ../k8s/base/manifests:/manifests:ro
      - '${CODEX_AUTH_JSON_FILE:-./bootstrap/no-codex-auth.json}:/run/garrison/codex-auth.json:ro'
    depends_on:
      garrison-server:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Observability (enabled by default). Third-party images are pinned and match k8s/components/observability.
  # ------------------------------------------------------------------
  garrison-prometheus:
    container_name: 'garrison-prometheus'
    image: 'prom/prometheus:v3.5.4'
    restart: 'unless-stopped'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=1GB'
      - '--enable-feature=exemplar-storage'
      - '--enable-feature=created-timestamp-zero-ingestion'
    ports:
      - '127.0.0.1:${GARRISON_PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - garrison-prometheus-data:/prometheus
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  garrison-loki:
    container_name: 'garrison-loki'
    image: 'grafana/loki:3.5.5'
    restart: 'unless-stopped'
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:${GARRISON_LOKI_PORT:-3100}:3100'
    volumes:
      - ../k8s/components/observability/config/loki.yaml:/etc/loki/loki.yaml:ro
      - garrison-loki-data:/loki
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  garrison-tempo:
    container_name: 'garrison-tempo'
    image: 'grafana/tempo:2.6.1'
    restart: 'unless-stopped'
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - '127.0.0.1:${GARRISON_TEMPO_PORT:-3200}:3200'
    volumes:
      - ../k8s/components/observability/config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - garrison-tempo-data:/var/tempo
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3200/ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Alloy reads container logs through the Docker socket (read-only mount) and receives OTLP on 4317 and 4318.
  garrison-alloy:
    container_name: 'garrison-alloy'
    image: 'grafana/alloy:v1.5.0'
    restart: 'unless-stopped'
    command:
      - 'run'
      - '/etc/alloy/config.alloy'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '--disable-reporting'
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - garrison-alloy-data:/var/lib/alloy/data
    mem_limit: 384m
    depends_on:
      garrison-loki:
        condition: service_healthy
      garrison-tempo:
        condition: service_healthy

  garrison-grafana:
    container_name: 'garrison-grafana'
    image: 'grafana/grafana-oss:13.0.2'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${GARRISON_GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: 'admin'
      GF_SECURITY_ADMIN_PASSWORD: '${GARRISON_GRAFANA_PASSWORD:?set GARRISON_GRAFANA_PASSWORD in docker/.env (update.sh generates it)}'
      GF_SERVER_ROOT_URL: 'http://127.0.0.1:${GARRISON_GRAFANA_PORT:-3000}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: '/etc/grafana/dashboards/garrison/garrison-overview.json'
      GF_LOG_LEVEL: 'warn'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ../k8s/components/observability/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../k8s/components/observability/config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ../k8s/components/observability/config/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ../k8s/components/observability/dashboards:/etc/grafana/dashboards/garrison:ro
      - garrison-grafana-data:/var/lib/grafana
    mem_limit: 512m
    depends_on:
      garrison-prometheus:
        condition: service_healthy
      garrison-loki:
        condition: service_healthy
      garrison-tempo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  garrison-postgres-data:
  garrison-server-data:
  garrison-worker-1-workspaces:
  garrison-worker-2-workspaces:
  garrison-prometheus-data:
  garrison-loki-data:
  garrison-tempo-data:
  garrison-grafana-data:
  garrison-alloy-data:
